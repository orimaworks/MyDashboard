function isAchievementUnlocked(id){
  return !!ACHIEVEMENTS_UNLOCKED[id];
}

function unlockAchievement(id){
  if(ACHIEVEMENTS_UNLOCKED[id]) return; // déjà débloqué
  const def = ACHIEVEMENTS.find(a=>a.id===id);
  ACHIEVEMENTS_UNLOCKED[id] = new Date().toISOString();
  saveAchievements(ACHIEVEMENTS_UNLOCKED);
  const paid = payAchievementRewards();
  if(def) showAchievementToast(def, paid.total);
  checkUnlocks();   // un succès peut ouvrir un examen
}

function checkGlobalAchievements(){
  const sessions = loadSessions();
  const totalMs = sessions.reduce((sum,s)=>sum+(s.durationMs||0), 0);
  if(totalMs > 3600000){
    unlockAchievement("secret_addicted");
  }

  // Divers — Addict : nombre total de parties, tous modes confondus
  const totalSessions = sessions.length;
  const addictThresholds = [10, 25, 50, 75, 100];
  addictThresholds.forEach((threshold, i)=>{
    if(totalSessions >= threshold){
      unlockAchievement(`divers_addict_${i+1}`);
    }
  });

  // Divers — Empire I : au moins une bonne réponse pour chaque département, tous modes/parties confondus
  const correctCodes = new Set();
  sessions.forEach(s=> s.rounds.forEach(r=>{ if(r.correct) correctCodes.add(r.code || r.deptCode); }));
  if(DEPARTEMENTS.every(d=>correctCodes.has(d.code))){
    unlockAchievement("divers_empire_1");
  }

  // Divers — Maître des succès : tout débloqué sauf lui-même et les secrets
  const relevant = ACHIEVEMENTS.filter(a=>a.category !== "secret" && a.id !== "divers_master");
  if(relevant.length && relevant.every(a=>isAchievementUnlocked(a.id))){
    unlockAchievement("divers_master");
  }
}

function checkGenericClassicSpeedAchievements(session){
  // Ces succès concernent toute partie "classique" de 10 manches, quel que soit le mode
  // (Départements, Chefs-lieux, et les suivants) — sauf Speedrun 3 qui reste secret mais suit la même règle.
  if(session.rounds.length !== 10) return;
  if(session.durationMs<=90000) unlockAchievement("divers_sub90");
  if(session.durationMs<=60000) unlockAchievement("divers_sub60");
  if(session.durationMs<=30000) unlockAchievement("divers_sub30");
  if(session.durationMs<4000) unlockAchievement("secret_speedrun3");
}

function checkClassicAchievements(session){
  const correctCount = session.rounds.filter(r=>r.correct).length;
  unlockAchievement("classic_first");
  // ces succès sont formulés pour le format "10 manches" précisément (5/10, 8/10, 10/10) :
  // avec 25 ou 50 manches, atteindre 10 bonnes réponses n'a plus le même sens, donc on ne les évalue pas.
  if(session.rounds.length === 10){
    if(correctCount>=5) unlockAchievement("classic_5_10");
    if(correctCount>=8) unlockAchievement("classic_8_10");
    if(correctCount>=10) unlockAchievement("classic_10_10");
  }
  if(session.rounds.length === 25 && correctCount === 25) unlockAchievement("classic_a_plus");
  if(session.rounds.length === 50 && correctCount === 50) unlockAchievement("classic_a_plus_plus");
  checkGenericClassicSpeedAchievements(session);
  checkGlobalAchievements();
}

   ========================================================= */
function activePool(){
  return CONFIG.includeDom ? [...DEPARTEMENTS] : DEPARTEMENTS.filter(d=>!DOM_CODES.has(d.code));
}
function byName(){
  // trié parmi la pool active uniquement : si l'outre-mer est décoché,
  // il ne doit pas non plus apparaître comme choix Duo/Carré.
  return activePool().sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
}
function numericKey(code){
  if(code==="2A") return 20.1;
  if(code==="2B") return 20.2;
  return parseFloat(code);
}
function byNumber(){
  return activePool().sort((a,b)=>numericKey(a.code)-numericKey(b.code));
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickSessionDepartements(){
  const n = Math.min(CONFIG.classicLength || 10, activePool().length);
  return shuffle(activePool()).slice(0, n);
}
function pickRandomDept(excludeCode){
  const pool = activePool().filter(d=>d.code!==excludeCode);
  return pool[Math.floor(Math.random()*pool.length)];
}

/* =========================================================
   MODE CHAOS ("infinite random" — nom de travail)
   Chaque manche pioche aléatoirement une paire question/réponse
   parmi les attributs d'un département : numéro, nom, chef-lieu, région.
   Pas de case reverse ici : la direction fait déjà partie du hasard.
   Se débloque potentiellement plus tard (cf. isChaosModeUnlocked) —
   pour l'instant toujours accessible pour test.
   ========================================================= */
const CHAOS_QUESTION_ATTRS = ["code", "nom", "chefLieu"];
const CHAOS_ANSWER_ATTRS = ["code", "nom", "chefLieu", "region"];

function isChaosModeUnlocked(){
  // Hook pour un futur critère de déblocage (niveau, succès...). Toujours vrai pour l'instant.
  return true;
}

function attrLabel(attr){
  return { code:"Numéro", nom:"Département", chefLieu:"Chef-lieu", region:"Région" }[attr] || attr;
}

function pickChaosPairing(){
  const q = CHAOS_QUESTION_ATTRS[Math.floor(Math.random()*CHAOS_QUESTION_ATTRS.length)];
  let a;
  do { a = CHAOS_ANSWER_ATTRS[Math.floor(Math.random()*CHAOS_ANSWER_ATTRS.length)]; } while(a === q);
  return { qAttr:q, aAttr:a };
}

function getNameAlphaNeighbors(dept, count){
  const sorted = activePool().slice().sort((a,b)=>a.nom.localeCompare(b.nom, 'fr'));
  const idx = sorted.findIndex(d=>d.code===dept.code);
  const result = [];
  let lo = idx-1, hi = idx+1;
  while(result.length < count && (lo>=0 || hi<sorted.length)){
    if(hi<sorted.length){ result.push(sorted[hi]); hi++; }
    if(result.length<count && lo>=0){ result.push(sorted[lo]); lo--; }
  }
  return result.slice(0, count);
}

function getRegionDistractors(dept, count){
  const allRegions = [...new Set(activePool().map(d=>d.region))].filter(r=>r && r!==dept.region);
  return shuffle(allRegions).slice(0, count).map(r=>({region:r}));
}

function getChaosDistractors(dept, aAttr, count){
  if(aAttr === "code") return getNumericNeighbors(dept, count);
  if(aAttr === "nom") return getNameAlphaNeighbors(dept, count);
  if(aAttr === "chefLieu") return getChefLieuAlphaNeighbors(dept, count);
  return getRegionDistractors(dept, count); // region
}

let chaosGame = null;

function pickChaosSessionRounds(){
  const n = Math.min(CONFIG.chaosLength || 10, activePool().length);
  return shuffle(activePool()).slice(0, n).map(dept => ({ dept, ...pickChaosPairing() }));
}

function getChaosCurrentEntry(){
  return chaosGame.type === "classic" ? chaosGame.order[chaosGame.index] : chaosGame.current;
}

function startChaosSession(){
  chaosGame = {
    type: "classic",
    startedAt: Date.now(),
    order: pickChaosSessionRounds(),
    index: 0,
    rounds: [],
    score: 0,
    mode: null,
    roundStartTime: null,
    answered: false
  };
  renderChaosRound();
}

function startChaosInfini(submode){
  const type = submode === "hardcore" ? "chaos_infini_hardcore" : "chaos_infini_normal";
  const dept = pickRandomDept(null);
  chaosGame = {
    type,
    startedAt: Date.now(),
    rounds: [],
    score: 0,
    lives: type === "chaos_infini_normal" ? 3 : 0,
    maxLives: type === "chaos_infini_normal" ? 3 : 0,
    justLostLife: false,
    current: { dept, ...pickChaosPairing() },
    mode: type === "chaos_infini_hardcore" ? "cash" : null,
    roundStartTime: null,
    answered: false
  };
  renderChaosRound();
}

function chooseChaosMode(mode){
  chaosGame.mode = mode;
  chaosGame.roundStartTime = Date.now();
  renderChaosAnswerUI();
}

function submitChaosAnswer(chosenValue, precomputedResponseMs){
  if(chaosGame.answered) return;
  chaosGame.answered = true;
  const entry = getChaosCurrentEntry();
  const dept = entry.dept;
  const responseMs = precomputedResponseMs != null ? precomputedResponseMs : (Date.now() - chaosGame.roundStartTime);
  const expected = dept[entry.aAttr];
  const correct = chosenValue === expected;
  const kind = chaosAnswerKind(entry);
  const base = correct ? roundBasePoints(chaosGame.mode, kind) : 0;
  const bonus = correct ? computeSpeedBonus(chaosGame.mode, responseMs, kind) : 0;
  const points = base + bonus;
  chaosGame.score += points;
  chaosGame.rounds.push({
    deptCode: dept.code, deptNom: dept.nom, mode: chaosGame.mode,
    qAttr: entry.qAttr, aAttr: entry.aAttr,
    question: dept[entry.qAttr], attendu: expected, repondu: chosenValue || null,
    correct, points, base, bonus, responseMs
  });

  const html = correct
    ? `<span class="toast-line">✓ Bonne réponse</span> <span class="toast-code">+${points}pts</span>`
    : `<span class="toast-line">✗ Mauvaise réponse —</span> <span class="toast-code">${expected}</span> <span class="toast-line">· ${attrLabel(entry.aAttr)}</span>`;
  showToastEl(html, correct ? "ok" : "bad", 2000);

  if(chaosGame.type === "classic"){
    chaosGame.index++;
    chaosGame.answered = false;
    if(chaosGame.index >= chaosGame.order.length){
      finishChaosSession();
    } else {
      renderChaosRound();
    }
  } else if(chaosGame.type === "chaos_infini_normal"){
    if(!correct){
      chaosGame.lives--;
      chaosGame.justLostLife = true;
    }
    if(chaosGame.lives <= 0){
      finishChaosInfiniSession();
    } else {
      advanceChaosInfiniRound();
    }
  } else { // chaos_infini_hardcore
    if(!correct){
      finishChaosInfiniSession();
    } else {
      advanceChaosInfiniRound();
    }
  }
}

function advanceChaosInfiniRound(){
  const previousCode = chaosGame.current.dept.code;
  const dept = pickRandomDept(previousCode);
  chaosGame.current = { dept, ...pickChaosPairing() };
  chaosGame.mode = chaosGame.type === "chaos_infini_hardcore" ? "cash" : null;
  chaosGame.answered = false;
  renderChaosRound();
}

function passChaosRound(){
  if(chaosGame.answered) return;
  chaosGame.answered = true;
  const entry = getChaosCurrentEntry();
  const dept = entry.dept;
  chaosGame.rounds.push({
    deptCode: dept.code, deptNom: dept.nom, mode: "passé",
    qAttr: entry.qAttr, aAttr: entry.aAttr,
    question: dept[entry.qAttr], attendu: dept[entry.aAttr], repondu: null,
    correct: false, points: 0, base: 0, bonus: 0, responseMs: 0, skipped: true
  });
  if(chaosGame.type === "chaos_infini_normal"){
    chaosGame.lives--;
    chaosGame.justLostLife = true;
  }

}

  const n = Math.min(CONFIG.chefLieuLength || 10, activePool().length);

function getChefLieuAlphaNeighbors(dept, count){
  const sorted = activePool().slice().sort((a,b)=>a.chefLieu.localeCompare(b.chefLieu, 'fr'));
  const idx = sorted.findIndex(d=>d.code===dept.code);
  const result = [];
  let lo = idx-1, hi = idx+1;
  while(result.length < count && (lo>=0 || hi<sorted.length)){
    if(hi<sorted.length){ result.push(sorted[hi]); hi++; }
    if(result.length<count && lo>=0){ result.push(sorted[lo]); lo--; }
  }
  return result.slice(0, count);
}

function getExamRegions(){
  const groups = {};
  DEPARTEMENTS.forEach(d=>{

      key = "dom";
      label = "France d'outre-mer";
    } else {
      key = d.region;
      label = d.region;
    }
    if(!groups[key]) groups[key] = { key, label, codes: [] };
    groups[key].codes.push(d.code);
  });
  return Object.values(groups).sort((a,b)=>{
    if(a.key==="dom") return 1;
    if(b.key==="dom") return -1;
    return a.label.localeCompare(b.label, 'fr');

function getAlphaNeighbor(dept){
  const sorted = byName();
  const idx = sorted.findIndex(d=>d.code===dept.code);
  if(idx < sorted.length-1) return sorted[idx+1];
  return sorted[idx-1];
}
// Clé de barème : Duo et Carré ne dépendent pas de la réponse attendue (un clic reste un clic) ;
// en Cash, tout dépend de ce que le joueur doit saisir : "code" (pavé), "text" (nom / ville), "region".
function scoringKey(mode, kind){
  if(mode !== "cash") return mode;
  return kind === "text" ? "cashText" : kind === "region" ? "cashRegion" : "cash";
}
function roundBasePoints(mode, kind){
  return CONFIG[scoringKey(mode, kind)];
}
function chaosAnswerKind(entry){
  return entry.aAttr === "code" ? "code" : entry.aAttr === "region" ? "region" : "text";
}
function computeSpeedBonus(mode, responseMs, kind){
  if(!CONFIG.speedBonus || !CONFIG.speedBonus.enabled) return 0;
  const cfg = CONFIG.speedBonus[scoringKey(mode, kind)];
  if(!cfg) return 0;
  const t = responseMs/1000;
  if(t <= cfg.grace) return cfg.bonus;
  if(t >= cfg.window) return 0;
  const ratio = (cfg.window - t) / (cfg.window - cfg.grace);
  return Math.round(cfg.bonus * ratio); // arrondi pour rester simple visuellement
}

function getNumericNeighbors(dept, count){
  const sorted = byNumber();
  const idx = sorted.findIndex(d=>d.code===dept.code);
  const result = [];
  let lo = idx-1, hi = idx+1;
  while(result.length < count && (lo>=0 || hi<sorted.length)){
    if(hi<sorted.length){ result.push(sorted[hi]); hi++; }
    if(result.length<count && lo>=0){ result.push(sorted[lo]); lo--; }
  }
  return result.slice(0,count);
}

function submitAnswer(chosenCode, precomputedResponseMs){
  if(game.answered) return;
  game.answered = true;
  const dept = currentDept();
  const responseMs = precomputedResponseMs != null ? precomputedResponseMs : (Date.now() - game.roundStartTime);
  const correct = chosenCode === dept.code;
  let base, bonus;
  if(game.type === "exam"){
    base = correct ? 1 : 0; // en examen, le score = nombre de bonnes réponses, pas un barème
    bonus = 0;
  } else {
    const kind = game.reverse ? "text" : "code";
    base = correct ? roundBasePoints(game.mode, kind) : 0;
    bonus = correct ? computeSpeedBonus(game.mode, responseMs, kind) : 0;
  }
  const points = base + bonus;
  game.score += points;
  game.rounds.push({
    code: dept.code, nom: dept.nom, mode: game.mode,
    chosenCode, correct, points, base, bonus, responseMs
  });

  if(correct && dept.code === "69"){
    playRhoneSound(); // petit clin d'œil pour le Rhône
    unlockAchievement("secret_easter_egg");
  }
  if(correct && dept.code === "67"){
    playSixSevenSound(); // 6-7 : clin d'œil pour le Bas-Rhin
    unlockAchievement("secret_six_seven");
  }
  if(!correct && CONFIG.playerDept && dept.code === CONFIG.playerDept){
    unlockAchievement("secret_own_dept");
  }

  showAnswerToast(correct, dept, { total: points, base, bonus });

  if(game.type === "classic"){
    nextRound();
  } else if(game.type === "exam"){
    advanceExamRound();
  } else if(game.type === "infini_normal"){
    if(!correct){
      game.lives--;
      game.justLostLife = true;
    }
    if(game.lives <= 0){
      finishInfiniSession();
    } else {
      advanceInfiniRound();
    }
  } else { // infini_hardcore
    if(!correct){
      finishInfiniSession();
    } else {

    }
  }

function advanceExamRound(){
  game.index++;

  if(game.index >= game.order.length){
    finishExamSession();
  } else {

  }
}

function passRound(){
  if(game.answered) return;
  game.answered = true;
  const dept = currentDept();
  game.rounds.push({
    code: dept.code, nom: dept.nom, mode: "passé",
    chosenCode: null, correct: false, points: 0, base: 0, bonus: 0,
    responseMs: 0, skipped: true
  });
  if(game.type === "infini_normal"){
    game.lives--;
    game.justLostLife = true;
  }
  renderPassReveal(dept);
}

function nextRound(){
  game.index++;
  game.mode = null;
  game.answered = false;
  if(game.index >= game.order.length){

function advanceInfiniRound(){

  game.currentDept = pickRandomDept(previousCode);
  game.mode = game.type === "infini_hardcore" ? "cash" : null;
  game.answered = false;

function finishSession(){
  const durationMs = Date.now() - game.startedAt;
  const xpBefore = computeTotalXp();
  const session = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    type: "classic",
    date: new Date().toISOString(),
    durationMs,
    score: game.score,
    rounds: game.rounds
  };
  const sessions = loadSessions();
  sessions.push(session);
  saveSessions(sessions);
  checkClassicAchievements(session);
  checkLevelUpAndThemeUnlocks(xpBefore);
  renderRecap(session);
  game = null;
}

const LS_ACHV_PAID = "deptgame_achv_paid_v1";
const ACHV_REWARDS_CLASSIC  = { first:5,  "5":5,  "8":10, "10":15, a_plus:30, a_plus_plus:60 };
const ACHV_REWARDS_NORMAL   = { first:5,  "10":5, "25":10, "50":20, "100":40 };
const ACHV_REWARDS_HARDCORE = { first:10, "10":10, "25":20, "50":40, "100":80 };
const ACHV_REWARDS_OTHER = {
  exam_grand_cartographe:100, exam_grand_cartographe_cheflieu:100,
  divers_master:150, divers_empire_1:50,
  divers_addict_1:5, divers_addict_2:10, divers_addict_3:15, divers_addict_4:20, divers_addict_5:30,
  divers_sub90:10, divers_sub60:20, divers_sub30:40,
  secret_easter_egg:25, secret_six_seven:67, secret_addicted:50, secret_speedrun3:50,
  secret_own_dept:15, secret_own_dept_cheflieu:15, secret_theme_change:5, secret_casanier:25, secret_konami:30, secret_debug_tool:10
  // collection_1/2/3 : 0 (la collection est déjà sa propre récompense)
};
function achievementReward(id){
  if(ACHV_REWARDS_OTHER[id] != null) return ACHV_REWARDS_OTHER[id];
  const m = id.match(/^(?:cheflieu_|chaos_)?(classic|infini_normal|infini_hardcore)_(.+)$/);
  if(!m) return 0;
  const suffix = m[2].replace(/^(\d+)_10$/, "$1");   // "5_10" -> "5", "10_10" -> "10"
  const table = m[1] === "classic" ? ACHV_REWARDS_CLASSIC : m[1] === "infini_normal" ? ACHV_REWARDS_NORMAL : ACHV_REWARDS_HARDCORE;
  return table[suffix] || 0;
}
function loadAchvPaid(){
  try{ const raw = localStorage.getItem(LS_ACHV_PAID); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveAchvPaid(p){ localStorage.setItem(LS_ACHV_PAID, JSON.stringify(p)); }

// verse les récompenses des succès débloqués pas encore payés ; renvoie { total, count }
function payAchievementRewards(){
  const paid = loadAchvPaid();
  let total = 0, count = 0, changed = false;
  Object.keys(ACHIEVEMENTS_UNLOCKED).forEach(id=>{
    if(paid[id]) return;
    paid[id] = true; changed = true;
    const r = achievementReward(id);
    if(r > 0){ total += r; count++; }
  });
  if(changed) saveAchvPaid(paid);
  if(total > 0){
    const w = syncWallet();
    w.rewarded += total;
    saveWallet(w);
  }
  return { total, count };
}

function fmtDuration(ms){
  const s = Math.round(ms/1000);
  const m = Math.floor(s/60);
  const r = s%60;
  return m>0 ? `${m} min ${r.toString().padStart(2,'0')} s` : `${r} s`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) + " à " +
         d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

  const getStart = ()=>chaosGame.roundStartTime;

  if(chaosGame.mode === "cash"){
    if(aAttr === "code"){
      attachCashKeypad({
        getStartTime: getStart,
        isCorrect: c=>c === dept.code,
        submit: (c, ms)=>submitChaosAnswer(c, ms)
      });
    } else {
      const pool = aAttr === "region"
        ? [...new Set(activePool().map(d=>d.region))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr')).map(r=>({region:r}))
        : sortedPoolBy(aAttr);
      attachCashSearch({
        pool,
        label: d=>d[aAttr], value: d=>d[aAttr],
        emptyMsg: "Aucun résultat.",
        getStartTime: getStart,
        isCorrect: v=>v === dept[aAttr],
        submit: (v, ms)=>submitChaosAnswer(v, ms)
      });
    }
    return;
  }

  // duo / carré
  root.querySelectorAll(".choice-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const responseMs = Date.now() - chaosGame.roundStartTime;
      const correct = btn.dataset.value === dept[aAttr];
      root.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true);
      flashAndSubmit(btn, correct, ()=>submitChaosAnswer(btn.dataset.value, responseMs));
    });
  });
}

function renderHearts(){
  if(game.type !== "infini_normal") return "";
  let html = '<div class="hearts">';
  for(let i=0;i<game.maxLives;i++){
    if(i < game.lives){
      html += '<span class="heart">❤️</span>';
    } else if(i === game.lives && game.justLostLife){
      html += '<span class="heart breaking">💔</span>';
    } else {
      html += '<span class="heart">🤍</span>';
    }
  }
  html += '</div>';
  game.justLostLife = false; // consommé, ne pas rejouer l'animation aux rendus suivants
  return html;
}

// opts : { getStartTime(), isCorrect(cleanedCode), submit(cleanedCode, responseMs) }
function attachCashKeypad(opts){
  const form = document.getElementById("cash-form");
  const input = document.getElementById("cash-input");
  const displayEl = document.getElementById("keypad-display");
  const validateBtn = document.getElementById("keypad-validate");
  let buffer = "";
  let locked = false;

  const renderDisplay = (invalid)=>{
    displayEl.textContent = buffer || "—";
    displayEl.classList.toggle("invalid", !!invalid);
  };
  const finish = (cleaned, flashEl)=>{
    if(locked) return;
    locked = true;
    const responseMs = Date.now() - opts.getStartTime();
    input.disabled = true;
    form.querySelector("button").disabled = true;
    validateBtn.disabled = true;
    root.querySelectorAll(".keypad-key").forEach(k=>{ k.disabled = true; });
    flashAndSubmit(flashEl, opts.isCorrect(cleaned), ()=>opts.submit(cleaned, responseMs));
  };

  // --- champ texte (desktop) ---
  const isMobileLayout = window.matchMedia && window.matchMedia("(max-width: 680px)").matches;
  if(!isMobileLayout) input.focus(); // le temps de réponse compte : champ prêt dès l'affichage
  input.addEventListener("input", ()=>input.classList.remove("invalid"));
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const cleaned = normalizeCashInput(input.value);
    if(cleaned === ""){
      input.classList.add("invalid");
      input.value = "";
      input.focus();
      return;
    }
    finish(cleaned, input);
  });

  // --- pavé tactile (mobile) ---
  renderDisplay(false);
  root.querySelectorAll(".keypad-key").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(locked) return;
      const k = btn.dataset.key;
      if(k === "back") buffer = buffer.slice(0, -1);
      else if(buffer.length < 3) buffer += k;
      renderDisplay(false);
    });
  });
  validateBtn.addEventListener("click", ()=>{
    const cleaned = normalizeCashInput(buffer);
    if(cleaned === ""){ renderDisplay(true); return; }
    finish(cleaned, displayEl);
  });
}

// opts : { pool[], label(item), value(item), emptyMsg, getStartTime(), isCorrect(value), submit(value, responseMs) }
function attachCashSearch(opts){
  const input = document.getElementById("cash-search");
  const list = document.getElementById("cash-search-list");
  let locked = false;

  const renderList = ()=>{
    const q = normalizeForSearch(input.value.trim());
    const filtered = q === "" ? opts.pool : opts.pool.filter(d=>normalizeForSearch(opts.label(d)).includes(q));
    list.innerHTML = filtered.length
      ? filtered.map(d=>`<div class="cheat-item cheflieu-item" data-value="${opts.value(d)}">
           <span class="cheat-name">${opts.label(d)}</span>
         </div>`).join("")
      : `<div class="empty" style="padding:10px 0;">${opts.emptyMsg || "Aucun résultat."}</div>`;
    list.querySelectorAll(".cheflieu-item").forEach(item=>{
      item.addEventListener("click", ()=>{
        if(locked) return;
        locked = true;
        const responseMs = Date.now() - opts.getStartTime();
        const value = item.dataset.value;
        list.querySelectorAll(".cheflieu-item").forEach(i=>{ i.style.pointerEvents = "none"; });
        input.disabled = true;
        flashAndSubmit(item, opts.isCorrect(value), ()=>opts.submit(value, responseMs));
      });
    });
  };

  input.focus();
  input.addEventListener("input", renderList);
  renderList();
}

// Pools triés réutilisés par les différents modes
function sortedPoolBy(field){
  return activePool().slice().sort((a,b)=>a[field].localeCompare(b[field], 'fr'));
}

        getStartTime: ()=>game.roundStartTime,
        isCorrect: v=>v === currentDept().code,

function normalizeCashInput(raw){
  // ne garde que les caractères alphanumériques : "26+" -> "26", "89*" -> "89"
  let v = raw.replace(/[^0-9a-zA-Z]/g, "").toUpperCase();
  if(v==="") return "";
  if(v==="2A" || v==="2B") return v;
  // accepte "6" -> "06", "976", etc.
  if(/^\d+$/.test(v)){
    if(v.length===1) v = "0"+v;
    return v;
  }
  return v;
}

function showToastEl(innerHtml, type, duration=2000){
  const toast = document.createElement("div");
  toast.className = "toast " + type;
  toast.innerHTML = innerHtml;

  const stackIndex = document.querySelectorAll(".toast").length; // toasts déjà affichés
  document.body.appendChild(toast);

  const stackExtra = stackIndex * 48;
  if(window.visualViewport){
    const vv = window.visualViewport;
    const hiddenByKeyboard = window.innerHeight - (vv.height + vv.offsetTop);
    if(hiddenByKeyboard > 40){
      // clavier virtuel ouvert : on remonte le toast au-dessus
      toast.style.bottom = (hiddenByKeyboard + 14 + stackExtra) + "px";
    } else if(stackExtra > 0){
      toast.style.bottom = `calc(max(20px, env(safe-area-inset-bottom, 0px) + 12px) + ${stackExtra}px)`;
    }
  } else if(stackExtra > 0){
    toast.style.bottom = `calc(max(20px, env(safe-area-inset-bottom, 0px) + 12px) + ${stackExtra}px)`;
  }

  requestAnimationFrame(()=> toast.classList.add("show"));
  setTimeout(()=>{
    toast.classList.remove("show");
    setTimeout(()=> toast.remove(), 250);
  }, duration);
}

function renderAchievements(){
  setActiveTab("achievements");

  const categoryGroups = [
    { category:"classic", label:"Classique", subgroups:[{key:"dept", label:"Départements"},{key:"cheflieu", label:"Chefs-lieux"},{key:"chaos", label:"Chaos"}] },
    { category:"infini_normal", label:"Infini Normal", subgroups:[{key:"dept", label:"Départements"},{key:"cheflieu", label:"Chefs-lieux"},{key:"chaos", label:"Chaos"}] },
    { category:"infini_hardcore", label:"Infini Hardcore", subgroups:[{key:"dept", label:"Départements"},{key:"cheflieu", label:"Chefs-lieux"},{key:"chaos", label:"Chaos"}] },
    { category:"exam", label:"Examen", subgroups:null },
    { category:"collection", label:"Collection", subgroups:null },
    { category:"divers", label:"Divers", subgroups:null },
    { category:"secret", label:"Secrets", subgroups:null }
  ];

  const buildTile = (a)=>{
    const unlocked = isAchievementUnlocked(a.id);
    if(a.secret && !unlocked){
      return `
        <div class="achv-tile locked">
          <span class="achv-icon">🔒</span>
          <span class="achv-title">???</span>
          <span class="achv-desc">Succès secret</span>
        </div>`;
    }
    return `
      <div class="achv-tile ${unlocked ? "unlocked" : "locked"}">
        <span class="achv-icon">${unlocked ? "🏆" : "🔒"}</span>
        <span class="achv-title">${a.title}</span>
        <span class="achv-desc">${a.desc}</span>
        ${(achievementReward(a.id) > 0 && isPassUnlocked()) ? `<span class="achv-reward">${unlocked ? "Reçu" : "Récompense"} : +${achievementReward(a.id)} ${brossardSymbolHtml()}</span>` : ""}
        ${unlocked ? `<span class="achv-date">débloqué le ${fmtDate(ACHIEVEMENTS_UNLOCKED[a.id])}</span>` : ""}
      </div>`;
  };

  const buildSection = (label, items)=>{
    const unlockedCount = items.filter(a=>isAchievementUnlocked(a.id)).length;
    return `
      <h2 class="section-title">${label} <span class="muted" style="font-size:14px; font-weight:400;">(${unlockedCount}/${items.length})</span></h2>
      <div class="achv-grid">${items.map(buildTile).join("")}</div>
    `;
  };

  const totalUnlocked = ACHIEVEMENTS.filter(a=>isAchievementUnlocked(a.id)).length;

  const sectionsHtml = categoryGroups.map(group=>{
    const items = ACHIEVEMENTS.filter(a=>a.category===group.category);
    if(!group.subgroups){
      return buildSection(group.label, items);
    }
    return group.subgroups.map(sub=>{
      const subItems = items.filter(a=>a.subgroup===sub.key);
      if(!subItems.length) return "";
      return buildSection(`${group.label} — ${sub.label}`, subItems);
    }).join("");
  }).join("");

  root.innerHTML = `
    <div class="card">
      <h1>Succès</h1>
      <p class="lead">${totalUnlocked} / ${ACHIEVEMENTS.length} succès débloqués.</p>
      ${sectionsHtml}
    </div>
  `;
}

      <div class="cheat-grid" id="cheat-grid">${buildGrid(sortedByCode)}</div>
    </div>
  `;

  const search = document.getElementById("cheat-search");
  const grid = document.getElementById("cheat-grid");
  search.addEventListener("input", ()=>{
    const q = normalizeForSearch(search.value.trim());
    const filtered = q === "" ? sortedByCode : sortedByCode.filter(d=>
      normalizeForSearch(d.code).includes(q) ||
      normalizeForSearch(d.nom).includes(q) ||
      normalizeForSearch(d.chefLieu).includes(q) ||
      (d.region && normalizeForSearch(d.region).includes(q))
    );
    grid.innerHTML = filtered.length ? buildGrid(filtered) : `<div class="empty">Aucun résultat ne correspond.</div>`;
  });
}

function modeLabel(type){
  if(type === "infini_normal") return "Infini normal";
  if(type === "infini_hardcore") return "Infini hardcore";
  if(type === "cheflieu_classic") return "Chefs-lieux";
  if(type === "cheflieu_infini_normal") return "Chefs-lieux Infini";
  if(type === "cheflieu_infini_hardcore") return "Chefs-lieux Hardcore";
  if(type === "exam") return "Examen";
  if(type === "exam_cheflieu") return "Examen Chefs-lieux";
  return "Classique";
}

/* Navigation Statistiques : parent (Départements / Chefs-lieux / Chaos)
   -> enfant (Classique / Infini normal / Infini hardcore / Examens)
   -> pour Classique uniquement : longueur de partie (10 / 25 / 50). */
let statsParent = "dept";
let statsChild = "classic";
let statsLen = 10;
const STATS_LENGTHS = [10, 25, 50];
const STATS_PARENTS = [
  { key:"dept",     label:"Départements", prefix:"" },
  { key:"cheflieu", label:"Chefs-lieux",  prefix:"cheflieu_" },
  { key:"chaos",    label:"🎲 Chaos",     prefix:"chaos_" }
];
const STATS_CHILDREN = [
  { key:"classic",         label:"Classique" },
  { key:"infini_normal",   label:"Infini normal" },
  { key:"infini_hardcore", label:"Infini hardcore" },
  { key:"exam",            label:"Examens" }   // pas d'examens en Chaos
];

function statsChildrenFor(parentKey){
  return STATS_CHILDREN.filter(c=>c.key !== "exam" || parentKey !== "chaos");
}

// clé de type de session correspondant à (parent, enfant)
function statsTypeKey(parentKey, childKey){
  if(childKey === "exam") return parentKey === "cheflieu" ? "exam_cheflieu" : "exam";
  const prefix = STATS_PARENTS.find(p=>p.key===parentKey).prefix;
  return prefix + childKey;
}

// ancien format de clé ("cheflieu_classic", "chaos_infini_normal", "exam"...) -> (parent, enfant)
function parseLegacyStatsKey(key){
  if(key === "exam") return { parent:"dept", child:"exam" };
  if(key === "exam_cheflieu") return { parent:"cheflieu", child:"exam" };
  let parent = "dept", rest = key;
  if(key.startsWith("cheflieu_")){ parent = "cheflieu"; rest = key.slice(9); }
  else if(key.startsWith("chaos_")){ parent = "chaos"; rest = key.slice(6); }
  if(!STATS_CHILDREN.some(c=>c.key===rest)) rest = "classic";
  return { parent, child: rest };
}

// longueur de partie "classique" rangée dans le palier le plus proche (10 / 25 / 50)
function classicLengthBucket(session){
  const n = (session.rounds || []).length;
  if(n <= 17) return 10;
  if(n <= 37) return 25;
  return 50;
}
const STATS_PODIUM_STAGES = [3, 50, 100];
let statsPodiumLimit = { infini_normal: 3, infini_hardcore: 3, cheflieu_infini_normal: 3, cheflieu_infini_hardcore: 3, chaos_infini_normal: 3, chaos_infini_hardcore: 3 };

function buildWorstDeptsHtml(rounds){
  const missCount = {};
  rounds.forEach(r=>{ if(!r.correct){ const code = r.code || r.deptCode; missCount[code] = (missCount[code]||0)+1; } });
  const worstList = Object.entries(missCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const nameByCode = Object.fromEntries(DEPARTEMENTS.map(d=>[d.code,d.nom]));
  const rows = worstList.length ? worstList.map(([code,count])=>`
      <tr><td class="num">${code}</td><td>${nameByCode[code]||"?"}</td><td class="num">${count}</td></tr>
    `).join("") : `<tr><td colspan="3" class="muted">Aucune erreur enregistrée</td></tr>`;
  return `
    <h2 class="section-title">Départements les plus ratés</h2>
    <table>
      <thead><tr><th>Code</th><th>Département</th><th>Erreurs</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildClassicStatsHtml(allSessions, type, length){
  const sessions = allSessions.filter(s=>(s.type||"classic")===type && classicLengthBucket(s)===length);
  if(!sessions.length){
    return `<div class="empty">Aucune partie de ${length} manches enregistrée pour l'instant dans ce mode.</div>`;
  }
  const sorted = sessions.slice().reverse();
  const totalSessions = sessions.length;
  const avgScore = (sessions.reduce((s,x)=>s+x.score,0)/totalSessions).toFixed(1);
  const bestScore = Math.max(...sessions.map(s=>s.score));
  const allRounds = sessions.flatMap(s=>s.rounds);
  const avgTime = allRounds.length ? (allRounds.reduce((s,r)=>s+r.responseMs,0)/allRounds.length/1000).toFixed(1) : "—";

  const rows = sorted.map(s=>`
    <tr>
      <td>${fmtDate(s.date)}</td>
      <td class="num">${s.rounds.length}</td>
      <td class="num">${s.score}</td>
      <td class="num">${s.rounds.filter(r=>r.correct).length}/${s.rounds.length}</td>
      <td class="num">${fmtDuration(s.durationMs)}</td>
    </tr>
  `).join("");

  return `
    <div class="stat-grid">
      <div class="stat-box"><div class="v">${totalSessions}</div><div class="l">parties jouées</div></div>
      <div class="stat-box"><div class="v">${avgScore}</div><div class="l">score moyen</div></div>
      <div class="stat-box"><div class="v">${bestScore}</div><div class="l">meilleur score</div></div>
      <div class="stat-box"><div class="v">${avgTime}s</div><div class="l">temps moyen / réponse</div></div>
    </div>
    ${buildWorstDeptsHtml(allRounds)}
    <h2 class="section-title">Historique des parties</h2>
    <table>
      <thead><tr><th>Date</th><th>Manches</th><th>Score</th><th>Réussite</th><th>Durée</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildInfiniStatsHtml(allSessions, type){
  const sessions = allSessions.filter(s=>s.type===type);
  if(!sessions.length){
    return `<div class="empty">Aucune partie dans ce mode pour l'instant.</div>`;
  }
  const sorted = sessions.slice().reverse();
  const totalSessions = sessions.length;
  const bestScore = Math.max(...sessions.map(s=>s.score));
  const allRounds = sessions.flatMap(s=>s.rounds);
  const avgTime = allRounds.length ? (allRounds.reduce((s,r)=>s+r.responseMs,0)/allRounds.length/1000).toFixed(1) : "—";

  const ranked = sessions
    .map(s=>({ streak: s.rounds.filter(r=>r.correct).length, durationMs: s.durationMs, date: s.date }))
    .sort((a,b)=>b.streak-a.streak);

  const limit = statsPodiumLimit[type];
  const shown = ranked.slice(0, limit);
  const medals = ["🥇","🥈","🥉"];
  const podiumRows = shown.length ? shown.map((item,i)=>`
      <div class="podium-row">
        <span class="podium-medal">${i<3 ? medals[i] : `#${i+1}`}</span>
        <span class="podium-streak">${item.streak} bonnes réponses</span>
        <span class="podium-time muted">${fmtDuration(item.durationMs)}</span>
      </div>
    `).join("") : `<div class="empty" style="padding:12px 0;">Aucune partie dans ce mode pour l'instant.</div>`;

  const showMore = limit < 100 && ranked.length > limit;
  const showLess = limit > 3;

  const rows = sorted.map(s=>`
    <tr>
      <td>${fmtDate(s.date)}</td>
      <td class="num">${s.score}</td>
      <td class="num">${s.rounds.filter(r=>r.correct).length}/${s.rounds.length}</td>
      <td class="num">${fmtDuration(s.durationMs)}</td>
    </tr>
  `).join("");

  return `
    <div class="stat-grid">
      <div class="stat-box"><div class="v">${totalSessions}</div><div class="l">parties jouées</div></div>
      <div class="stat-box"><div class="v">${bestScore}</div><div class="l">meilleur score</div></div>
      <div class="stat-box"><div class="v">${avgTime}s</div><div class="l">temps moyen / réponse</div></div>
    </div>
    <h2 class="section-title">Podium — meilleures séries</h2>
    <div class="podium-list">${podiumRows}</div>
    <div class="btn-row">
      ${showMore ? `<button class="ghost" id="btn-podium-more" data-type="${type}">Afficher plus</button>` : ""}
      ${showLess ? `<button class="ghost" id="btn-podium-less" data-type="${type}">Afficher moins</button>` : ""}
    </div>
    ${buildWorstDeptsHtml(allRounds)}
    <h2 class="section-title">Historique des parties</h2>
    <table>
      <thead><tr><th>Date</th><th>Score</th><th>Réussite</th><th>Durée</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildExamStatsHtml(allSessions, type){
  const sessions = allSessions.filter(s=>s.type===type);
  const regions = getExamRegions();

  const regionRow = (label, key, total)=>{
    const attempts = sessions.filter(s=>s.examKey===key);
    if(!attempts.length){
      return `<tr><td>${label}</td><td class="num">0</td><td class="num">— / ${total}</td><td class="num">—</td></tr>`;
    }
    const best = Math.max(...attempts.map(s=>s.score));
    const bestTime = Math.min(...attempts.filter(s=>s.score===best).map(s=>s.durationMs));
    return `<tr><td>${label}</td><td class="num">${attempts.length}</td><td class="num">${best} / ${total}</td><td class="num">${fmtDuration(bestTime)}</td></tr>`;
  };

  const rows = [
    regionRow("🏆 Examen final", "final", DEPARTEMENTS.length),
    ...regions.map(r=>regionRow(r.label, r.key, r.codes.length))
  ].join("");

  const historyRows = sessions.slice().reverse().map(s=>`
    <tr>
      <td>${fmtDate(s.date)}</td>
      <td>${s.examLabel || s.examKey}</td>
      <td class="num">${s.score} / ${s.total}</td>
      <td class="num">${fmtDuration(s.durationMs)}</td>
    </tr>
  `).join("");

  return `
    <h2 class="section-title" style="margin-top:0; border-top:none; padding-top:0;">Par région</h2>
    <table>
      <thead><tr><th>Région</th><th>Tentatives</th><th>Meilleur score</th><th>Meilleur temps</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <h2 class="section-title">Historique des examens</h2>
    ${sessions.length ? `
      <table>
        <thead><tr><th>Date</th><th>Région</th><th>Score</th><th>Durée</th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table>` : `<div class="empty">Aucun examen passé pour l'instant.</div>`}`;
}

// région de chaque département (pour les couleurs)
const PASS_DEPT_REGION = {};
DEPARTEMENTS.forEach(d=>{ PASS_DEPT_REGION[d.code] = d.region; });

function passRegionHue(name){
  const i = passCatalog().region.findIndex(r=>r.label === name);
  return ((i < 0 ? 0 : i) * 137.5) % 360;      // angle d'or : teintes bien réparties
}

// SVG de la carte pour un onglet : "dept" | "chef" | "region"
function passMapSvgHtml(tab, coll){
  const D = MAP_DATA;
  const sel = passUi.forge ? passUi.forgeSel : passUi.mapSel;
  let shapes = "", selShape = "", dots = "", frames = "";

  const idFor = (code, regionName)=> tab === "region" ? "r:" + regionName : (tab === "chef" ? "c:" : "d:") + code;
  const addShape = (id, d, code, regionName)=>{
    const owned = !!coll.owned[id];
    const hue = passRegionHue(regionName);
    let fill;
    if(tab === "chef")      fill = owned ? `hsl(${hue} 40% 30%)` : "var(--panel-light)";
    else                    fill = owned ? `hsl(${hue} 55% 50%)` : "var(--panel-light)";
    const cls = ["pm-shape", owned ? "owned" : "locked"];
    if(passUi.forge && !owned) cls.push("pickable");
    if(sel === id) cls.push("sel");
    const html = `<path class="${cls.join(" ")}" data-id="${id}" style="fill:${fill}" fill-rule="evenodd" d="${d}"/>`;
    if(sel === id) selShape = html; else shapes += html;
  };
  const addDot = (code)=>{
    if(tab !== "chef") return;
    const p = D.chef[code]; if(!p) return;
    const owned = !!coll.owned["c:" + code];
    dots += `<circle class="pm-dot ${owned ? "owned" : ""}" cx="${p[0]}" cy="${p[1]}" r="${owned ? 52 : 28}"/>`;
  };

  if(tab === "region"){
    Object.keys(D.region).forEach(name=>addShape(idFor(null, name), D.region[name], null, name));
  } else {
    Object.keys(D.dept).forEach(code=>addShape(idFor(code), D.dept[code], code, PASS_DEPT_REGION[code]));
  }
  Object.keys(D.chef).forEach(code=>{ if(D.dept[code]) addDot(code); });

  // outre-mer : cinq encarts sous la carte
  D.insets.forEach(ins=>{
    frames += `<rect class="pm-frame" x="${ins.x}" y="${ins.y}" width="${ins.w}" height="${ins.h}" rx="60"/>`;
    addShape(idFor(ins.code, ins.region), ins.d, ins.code, ins.region);
    addDot(ins.code);
    frames += `<text class="pm-label" x="${ins.x + ins.w/2}" y="${ins.y + ins.h + 250}" text-anchor="middle">${tab === "region" ? ins.region : ins.code}</text>`;
  });

  return `<svg class="pass-map" viewBox="0 0 ${D.W} ${D.H + 300}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de France">
    ${frames}<g class="pm-shapes">${shapes}${selShape}</g><g class="pm-dots">${dots}</g></svg>`;
}

// légende de l'élément touché (hors mode Faussaire)
function passMapCaptionHtml(coll){
  const id = passUi.mapSel;
  if(!id) return `<span class="muted">Touchez une zone de la carte pour voir son détail.</span>`;
  const it = passCatalog().byId[id];
  if(!it) return "";
  const owned = !!coll.owned[id];
  const tag = `<span class="pm-tag">${PASS_TYPE_LABEL[it.type]}</span>`;
  if(it.type === "region")
    return owned ? `${tag} <b>${it.label}</b> <span class="muted">· ${it.count} dép.</span>`
                 : `${tag} <b>${it.label}</b> <span class="muted">· non obtenue</span>`;
  if(it.type === "chef")
    return owned ? `${tag} <b>${it.code}</b> ${it.label} <span class="muted">(${it.deptNom})</span>`
                 : `${tag} <b>${it.code}</b> ??? <span class="muted">· non obtenu</span>`;
  return owned ? `${tag} <b>${it.code}</b> ${it.label} <span class="muted">· ${PASS_DEPT_REGION[it.code]}</span>`
               : `${tag} <b>${it.code}</b> ??? <span class="muted">· non obtenu</span>`;
}

function passMapTap(id){
  const coll = passStore().load();
  if(passUi.forge){
    if(coll.owned[id]) return;           // on ne forge que ce qui manque
    passUi.forgeSel = id;
    passRerender("pass-map-info", "center");
    return;
  }
  passUi.mapSel = id;
  // mise à jour sur place : la carte (et son zoom) ne bouge pas
  root.querySelectorAll(".pm-shape.sel").forEach(e=>e.classList.remove("sel"));
  const el = root.querySelector(`.pm-shape[data-id="${id.replace(/"/g, '\\"')}"]`);
  if(el){ el.classList.add("sel"); el.parentNode.appendChild(el); }   // dessiné au-dessus des voisins
  const info = document.getElementById("pass-map-info");
  if(info) info.innerHTML = passMapCaptionHtml(coll);
}

/* =========================================================
   PASS NAVI'GO — COLLECTION, PACKS, DOUBLONS, FAUSSAIRE
   220 éléments à collectionner : 101 départements, 101 chefs-lieux, 18 régions.
   Identifiants : "d:<code>", "c:<code>", "r:<nom de région>".
   ========================================================= */
const LS_COLLECTION = "deptgame_collection_v1";

// remboursement d'un doublon (bouton « Vendre »)
const PASS_DUPE_REFUND = { dc:3, region:80, rare:150 };   // dc = département ou chef-lieu
const PASS_FORGE_PRICE = 1200;                  // Faussaire : un élément inédit, au choix

// Packs. Tirages avec remise (uniformes) dans chaque catégorie.
//   dept / chef : nombre de tirages ; mixed : tirages dans départements ∪ chefs-lieux
//   region : nombre fixe ; regionChance : 0 ou 1 région avec cette probabilité ;
//   regionMin / regionMax : nombre de régions tiré uniformément entre les deux
const PASS_PACKS = [
  { key:"dept10",  name:"Pack départements", price:100, desc:"10 départements",                                            dept:10 },
  { key:"chef10",  name:"Pack chefs-lieux",  price:100, desc:"10 chefs-lieux",                                             chef:10 },
  { key:"region1", name:"Pack région",       price:200, desc:"1 région",                                                   region:1 },
  { key:"trotter", name:"Trotter pack",      price:250, desc:"15 départements ou chefs-lieux + 0 à 1 région (50 %)",       mixed:15, regionChance:0.5, rareChance:0.02 },
  { key:"lucky",   name:"Lucky pack",        price:400, desc:"15 départements + 15 chefs-lieux + 1 région",                dept:15, chef:15, region:1, rareChance:0.04 },
  { key:"mega",    name:"Mega pack",         price:700, desc:"25 départements + 25 chefs-lieux + 1 à 2 régions",           dept:25, chef:25, regionMin:1, regionMax:2, rareChance:0.08 }
];
const PASS_TYPE_LABEL = { dept:"Département", chef:"Chef-lieu", region:"Région", rare:"Exclusivité" };

// Exclusivités : hors des 220 éléments (la « collection complète » reste celle de 220), jamais forgeables.
// rareChance (par pack) = probabilité d'en tirer UNE ; weight = poids relatif entre exclusivités.
const PASS_EXCLU_LABEL = ()=>`Exclusivité via le ${PASS_NAME}`;
const PASS_RARES = [
  { id:"x:fond",         kind:"fond",  label:"Fonds d'écran",  weight:40, blurb:"Ouvre Réglages › Fond : chaque département obtenu offre son pavage." },
  { id:"x:theme:braise", kind:"theme", themeId:"braise", label:"Palette Braise", weight:35, blurb:"Nuit de forge : lueur de four et braises qui montent." },
  { id:"x:theme:prisme", kind:"theme", themeId:"prisme", label:"Palette Prisme", weight:25, blurb:"Holographique : les couleurs glissent lentement sur le spectre." }
];
function passPackDesc(p){
  return p.desc + (p.rareChance ? ` · ✦ ${(p.rareChance * 100).toLocaleString("fr-FR")} % d'une exclusivité` : "");
}

// --- catalogue des 220 éléments ---
let _passCatalog = null;
function passCatalog(){
  if(_passCatalog) return _passCatalog;
  const sorted = [...DEPARTEMENTS].sort((x,y)=>numericKey(x.code)-numericKey(y.code));
  const dept = sorted.map(d=>({ id:"d:"+d.code, type:"dept", code:d.code, label:d.nom }));
  const chef = sorted.map(d=>({ id:"c:"+d.code, type:"chef", code:d.code, label:d.chefLieu, deptNom:d.nom }));
  const names = [...new Set(sorted.map(d=>d.region).filter(Boolean))].sort((x,y)=>x.localeCompare(y,"fr"));
  const region = names.map(n=>({ id:"r:"+n, type:"region", label:n, count:sorted.filter(d=>d.region===n).length }));
  const rare = PASS_RARES.map(r=>({ id:r.id, type:"rare", kind:r.kind, themeId:r.themeId, label:r.label, weight:r.weight, blurb:r.blurb }));
  const byId = {};
  [...dept, ...chef, ...region, ...rare].forEach(it=>{ byId[it.id] = it; });
  _passCatalog = { dept, chef, region, rare, all:[...dept, ...chef, ...region], byId };   // « all » = les 220 éléments (sans exclusivités)
  return _passCatalog;
}

// --- collection persistante : { owned:{id:1}, dupes:{dc,r}, opened:{packKey:n}, forged:n } ---
// Les doublons ne sont pas détaillés : un simple compteur (dc = dép./chefs-lieux, r = régions).
function emptyCollection(){
  return { owned:{}, dupes:{ dc:0, r:0, x:0 }, opened:{}, forged:0 };
}
function normalizeCollection(raw){
  const c = emptyCollection();
  if(!raw || typeof raw !== "object") return c;
  const cat = passCatalog();
  if(raw.owned && typeof raw.owned === "object"){
    Object.keys(raw.owned).forEach(id=>{ if(cat.byId[id]) c.owned[id] = 1; });
  }
  if(raw.dupes && typeof raw.dupes === "object"){
    c.dupes.dc = Math.max(0, parseInt(raw.dupes.dc, 10) || 0);
    c.dupes.r  = Math.max(0, parseInt(raw.dupes.r, 10) || 0);
    c.dupes.x  = Math.max(0, parseInt(raw.dupes.x, 10) || 0);
  }
  if(raw.opened && typeof raw.opened === "object"){
    PASS_PACKS.forEach(p=>{
      const n = parseInt(raw.opened[p.key], 10);
      if(n > 0) c.opened[p.key] = n;
    });
  }
  c.forged = Math.max(0, parseInt(raw.forged, 10) || 0);
  return c;
}
function loadCollection(){
  try{
    const raw = localStorage.getItem(LS_COLLECTION);
    return normalizeCollection(raw ? JSON.parse(raw) : null);
  }catch(e){ return emptyCollection(); }
}
function saveCollection(c){
  localStorage.setItem(LS_COLLECTION, JSON.stringify(c));
}

function passCollectionStats(c){
  const cat = passCatalog();
  const out = { have:0, total:0 };
  ["dept","chef","region"].forEach(t=>{
    const have = cat[t].filter(it=>c.owned[it.id]).length;
    out[t] = { have, total:cat[t].length };
    out.have += have;
    out.total += cat[t].length;
  });
  out.complete = out.have === out.total;
  out.rare = { have:cat.rare.filter(it=>c.owned[it.id]).length, total:cat.rare.length };   // hors total des 220
  return out;
}
function passDupesValue(c){
  return c.dupes.dc * PASS_DUPE_REFUND.dc + c.dupes.r * PASS_DUPE_REFUND.region + c.dupes.x * PASS_DUPE_REFUND.rare;
}

// --- « magasin » : portefeuille + collection réels, ou bac à sable (Brossards fictifs, en mémoire) ---
const realPassStore = {
  balance: getBrossards, spend: spendBrossards, credit: creditBrossards,
  load: loadCollection, save: saveCollection
};
let passSandbox = null;   // { balance, collection } tant que le bac à sable est actif
const sandboxPassStore = {
  balance: ()=>passSandbox.balance,
  spend: (n)=>{
    if(n <= 0 || passSandbox.balance < n) return false;
    passSandbox.balance -= n;
    return true;
  },
  credit: (n)=>{ if(n > 0) passSandbox.balance += n; },
  load: ()=>passSandbox.collection,
  save: (c)=>{ passSandbox.collection = c; }
};
function passStore(){ return passSandbox ? sandboxPassStore : realPassStore; }
function passIsOpen(){ return PASS_ENABLED || !!passSandbox; }

// --- succès liés à la collection (appelé après chaque achat / forge réels, import, changement de département) ---
const PASS_DOM_CODES = ["971","972","973","974","976"];
function checkCollectionAchievements(coll){
  coll = coll || loadCollection();
  const cat = passCatalog();
  const domIds = new Set();
  PASS_DOM_CODES.forEach(c=>{ domIds.add("d:" + c); domIds.add("c:" + c); domIds.add("r:" + PASS_DEPT_REGION[c]); });
  const all = cat.all.map(it=>it.id);
  const dom = all.filter(id=>domIds.has(id));
  const metro = all.filter(id=>!domIds.has(id));
  if(dom.every(id=>coll.owned[id])) unlockAchievement("collection_1");
  if(metro.every(id=>coll.owned[id])) unlockAchievement("collection_2");
  if(all.every(id=>coll.owned[id])) unlockAchievement("collection_3");
  if(CONFIG.playerDept && coll.owned["d:" + CONFIG.playerDept]) unlockAchievement("secret_casanier");
}

// --- tirage d'un pack : renvoie la liste des identifiants tirés ---
function passRoll(pack, rng){
  rng = rng || Math.random;
  const cat = passCatalog();
  const pick = (arr)=>arr[Math.floor(rng() * arr.length)];
  const ids = [];
  for(let i=0; i<(pack.dept||0); i++) ids.push(pick(cat.dept).id);
  for(let i=0; i<(pack.chef||0); i++) ids.push(pick(cat.chef).id);
  if(pack.mixed){
    const both = cat.dept.concat(cat.chef);
    for(let i=0; i<pack.mixed; i++) ids.push(pick(both).id);
  }
  let nbRegions = pack.region || 0;
  if(pack.regionChance) nbRegions = rng() < pack.regionChance ? 1 : 0;
  if(pack.regionMin){
    nbRegions = pack.regionMin + Math.floor(rng() * (pack.regionMax - pack.regionMin + 1));
  }
  for(let i=0; i<nbRegions; i++) ids.push(pick(cat.region).id);
  if(pack.rareChance && rng() < pack.rareChance){          // exclusivité : au plus une par pack, pondérée
    const total = cat.rare.reduce((a, r)=>a + r.weight, 0);
    let x = rng() * total, chosen = cat.rare[cat.rare.length - 1];
    for(const r of cat.rare){ x -= r.weight; if(x < 0){ chosen = r; break; } }
    ids.push(chosen.id);
  }
  return ids;
}

// --- achat de `qty` packs ---
function passBuyPack(packKey, qty, store, rng){
  store = store || passStore();
  const pack = PASS_PACKS.find(p=>p.key===packKey);
  if(!pack) return { ok:false, error:"pack" };
  qty = Math.max(1, parseInt(qty, 10) || 1);
  const cost = pack.price * qty;
  if(!store.spend(cost)) return { ok:false, error:"funds" };
  const cat = passCatalog();
  const coll = store.load();
  const draws = [];
  const chunks = [];
  for(let q=0; q<qty; q++){
    const chunkStart = draws.length;
    passRoll(pack, rng).forEach(id=>{
      const it = cat.byId[id];
      if(coll.owned[id]){
        if(it.type === "region") coll.dupes.r++; else if(it.type === "rare") coll.dupes.x++; else coll.dupes.dc++;
        draws.push({ id, isNew:false });
      } else {
        coll.owned[id] = 1;
        draws.push({ id, isNew:true });
      }
    });
    chunks.push({ start:chunkStart, end:draws.length });
  }
  coll.opened[pack.key] = (coll.opened[pack.key] || 0) + qty;
  store.save(coll);
  if(store === realPassStore){ checkCollectionAchievements(coll); checkUnlocks(); }
  const newCount = draws.filter(d=>d.isNew).length;
  return { ok:true, kind:"buy", pack, qty, cost, draws, chunks, newCount, dupCount:draws.length - newCount };
}

// --- vente de tous les doublons ---
function passSellDuplicates(store){
  store = store || passStore();
  const coll = store.load();
  const count = coll.dupes.dc + coll.dupes.r + coll.dupes.x;
  const value = passDupesValue(coll);
  if(count <= 0) return { ok:false, error:"none" };
  store.credit(value);
  coll.dupes = { dc:0, r:0, x:0 };
  store.save(coll);
  return { ok:true, kind:"sell", count, value };
}

// --- Faussaire : forge un élément inédit au choix ---
function passForge(id, store){
  store = store || passStore();
  const cat = passCatalog();
  const it = cat.byId[id];
  if(!it) return { ok:false, error:"item" };
  const coll = store.load();
  if(coll.owned[id]) return { ok:false, error:"owned" };
  if(!store.spend(PASS_FORGE_PRICE)) return { ok:false, error:"funds" };
  coll.owned[id] = 1;
  coll.forged++;
  store.save(coll);
  if(store === realPassStore){ checkCollectionAchievements(coll); checkUnlocks(); }
  return { ok:true, kind:"forge", item:it, cost:PASS_FORGE_PRICE };
}

/* =========================================================
   ANIMATION D'OUVERTURE : booster qui tremble et s'ouvre, formes blanches qui en sortent,
   piles des nouveaux (par type) en haut, doublons (première forme tirée + ×N) en bas.
   Les formes sont redimensionnées pour occuper la même place : aucun département ni région
   n'est avantagé visuellement.
   ========================================================= */
const RV_ORDER = ["region", "dept", "chef"];
const RV_LABEL = { region:"Régions", dept:"Départements", chef:"Chefs-lieux", rare:"Exclusivités" };
const RV_HUE = { dept10:38, chef10:150, region1:215, trotter:175, lucky:285, mega:8 };
const rvSleep = (ms)=>new Promise(r=>setTimeout(r, ms));
const RV_MAX_FLYING = 56;   // au-delà : les éléments s'ajoutent d'un coup aux piles
// Cascade (plusieurs packs) : 1er booster en entier, puis boosters rapides + projecteur sur les nouvelles régions.
// Passer à false = retour à l'ancien comportement (un seul booster animé, le reste ajouté d'un coup).
let RV_CASCADE = true;

// boîte englobante d'un tracé "M x y l dx dy … z" (coordonnées relatives après M)
function pathBBox(d){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, x = 0, y = 0;
  const upd = ()=>{ if(x < minX) minX = x; if(x > maxX) maxX = x; if(y < minY) minY = y; if(y > maxY) maxY = y; };
  const re = /([Mlz])([^Mlz]*)/g; let m;
  while((m = re.exec(d))){
    const nums = (m[2].match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    if(m[1] === "M"){ x = nums[0]; y = nums[1]; upd(); }
    else if(m[1] === "l"){ for(let i = 0; i + 1 < nums.length; i += 2){ x += nums[i]; y += nums[i + 1]; upd(); } }
  }
  return { minX, minY, w:maxX - minX, h:maxY - minY };
}

const _shapeCache = {};
function passShapeInfo(item){
  if(_shapeCache[item.id]) return _shapeCache[item.id];
  let d = null;
  if(item.type === "dept"){
    d = MAP_DATA.dept[item.code] || (MAP_DATA.insets.find(i=>i.code === item.code) || {}).d;
  } else {
    d = MAP_DATA.region[item.label] || (MAP_DATA.insets.find(i=>i.region === item.label) || {}).d;
  }
  const b = pathBBox(d);
  const pad = Math.max(b.w, b.h) * 0.05;
  const info = { d, vb:`${b.minX - pad} ${b.minY - pad} ${b.w + 2*pad} ${b.h + 2*pad}` };
  _shapeCache[item.id] = info;
  return info;
}

// logo de ville (silhouette d'immeubles) : le chef-lieu n'a pas de forme géographique

      <rect x="39" y="30" width="3" height="3"/><rect x="39" y="39" width="3" height="3"/><rect x="52" y="43" width="3" height="3"/></g>

// icône des exclusivités (dorée) : cadre-image pour les fonds, palette de peintre pour les thèmes
function passRareFaceHtml(item, cls){
  const body = item.kind === "fond"
    ? `<rect x="8" y="12" width="48" height="40" rx="5" fill="none" stroke="#ffd66e" stroke-width="4.5"/><circle cx="23" cy="26" r="5" fill="#ffd66e"/><path d="M12 48l14-14 9 9 8-8 9 9v4z" fill="#ffd66e"/>`
    : `<path d="M32 6a26 26 0 1 0 0 52c4 0 6-3 4-7s0-7 5-7h6c6 0 9-4 9-9C56 17 46 6 32 6z" fill="#ffd66e"/><circle cx="20" cy="30" r="4" fill="#2a1c00"/><circle cx="30" cy="19" r="4" fill="#2a1c00"/><circle cx="43" cy="22" r="4" fill="#2a1c00"/>`;
  return `<svg class="${cls}" viewBox="0 0 64 64" aria-hidden="true">${body}<path d="M54 4l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff"/></svg>`;
}
function passFaceHtml(item, cls){
  if(item.type === "rare") return passRareFaceHtml(item, cls);
  if(item.type === "chef") return passCityLogoSvg(cls);
  const info = passShapeInfo(item);
  return `<svg class="${cls}" viewBox="${info.vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="${info.d}" fill="#fff" fill-rule="evenodd"/></svg>`;
}

function rvSlotHtml(type, kind){
  return `<div class="rv-slot t-${type}" data-type="${type}">
    <div class="rv-pile ${kind}"></div>
    <div class="rv-count"></div>
    <div class="rv-slot-label">${RV_LABEL[type]}</div>
  </div>`;
}

// ouverture animée d'un achat de packs ; done() est appelé à la fermeture
function playPackReveal(r, done){
  const cat = passCatalog();
  const draws = r.draws.map(d=>({ item:cat.byId[d.id], isNew:d.isNew }));
  const total = draws.length;
  const interval = Math.max(70, Math.min(260, Math.round(4200 / Math.min(total, RV_MAX_FLYING))));
  rvRun({
    kind:"pack", title:`${r.pack.name}${r.qty > 1 ? " ×" + r.qty : ""}`, hue:RV_HUE[r.pack.key] || 38,
    qty:r.qty, draws, interval, done,
    chunks:r.chunks, cascade:RV_CASCADE && r.qty > 1 && !!r.chunks
  });
}

// forge : pas de booster, l'élément apparaît seul dans un éclair
function playForgeReveal(item, done){
  rvRun({ kind:"forge", title:"Faussaire", hue:45, qty:1, draws:[{ item, isNew:true }], interval:0, done });
}

async function rvRun(cfg){
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const forge = cfg.kind === "forge";
  const overlay = document.createElement("div");
  overlay.className = "rv-overlay";
  overlay.innerHTML = `
    <div class="rv-stage">
      <div class="rv-head">${cfg.title}</div>
      ${cfg.cascade ? `<div class="rv-packctr" id="rv-packctr">Pack 1/${cfg.qty}</div>` : ""}
      ${forge ? `<div class="rv-forge-zone"><div class="rv-forge-flash"></div><div class="rv-forge-card" id="rv-forge-card"></div></div>` : `
      <div class="rv-booster-zone">
        <div class="rv-booster ${cfg.qty > 1 ? "multi" : ""}" id="rv-booster" style="--h:${cfg.hue}">
          <div class="rv-b-glow"></div>
          <div class="rv-b-beam"></div>
          <div class="rv-b-body"><span class="rv-b-logo">${PASS_NAME.replace(" ", "<br>")}</span><span class="rv-b-sym">${BROSSARD_SYMBOL}</span></div>
          <div class="rv-b-top"></div>
          ${cfg.qty > 1 ? `<span class="rv-b-qty">×${cfg.qty}</span>` : ""}
        </div>
      </div>
      <div class="rv-sec">Nouveaux</div>
      <div class="rv-row" id="rv-news">${[...RV_ORDER, "rare"].map(t=>rvSlotHtml(t, "new")).join("")}</div>
      <div class="rv-sec">Doublons</div>
      <div class="rv-row" id="rv-dupes">${[...RV_ORDER, "rare"].map(t=>rvSlotHtml(t, "dupe")).join("")}</div>`}
      <div class="rv-sum" id="rv-sum"></div>
      <div class="rv-actions"><button class="primary" id="rv-btn">Passer</button></div>
    </div>`;
  document.body.appendChild(overlay);

  const $ = (sel)=>overlay.querySelector(sel);
  const btn = $("#rv-btn");
  let skipped = reduce, finished = false, closed = false;
  let skipResolve; const skipPromise = new Promise(res=>{ skipResolve = res; });
  const sleepS = (ms)=>Promise.race([rvSleep(ms), skipPromise]);
  const counts = { new:{ region:0, dept:0, chef:0, rare:0 }, dupe:{ region:0, dept:0, chef:0, rare:0 } };
  const firstDupe = {};
  const firstDupeItem = {};   // premier doublon TIRÉ (ordre du tirage) de chaque type : c'est lui qui donne sa forme
  cfg.draws.forEach(d=>{ if(!d.isNew && !firstDupeItem[d.item.type]) firstDupeItem[d.item.type] = d.item; });
  const applied = new Array(cfg.draws.length).fill(false);
  const slotOf = (isNew, type)=>$(`#${isNew ? "rv-news" : "rv-dupes"} .rv-slot[data-type="${type}"]`);

  // met à jour piles, doublons et compteurs pour un élément
  const apply = (i, animate)=>{
    if(applied[i]) return;
    applied[i] = true;
    if(forge) return;   // pas de piles dans l'écran du Faussaire
    const d = cfg.draws[i], type = d.item.type;
    const slot = slotOf(d.isNew, type), pile = slot.querySelector(".rv-pile"), badge = slot.querySelector(".rv-count");
    if(type === "rare") overlay.classList.add("has-rare");   // l'emplacement « Exclusivités » n'apparaît que s'il sert (dans les 2 rangées)
    if(d.isNew){
      counts.new[type]++;
      const card = document.createElement("div");
      card.className = "rv-card" + (animate ? " pop" : "");
      card.dataset.id = d.item.id;
      card.style.transform = `translate(${(Math.random() * 12 - 6).toFixed(1)}px, ${(Math.random() * 10 - 5).toFixed(1)}px) rotate(${(Math.random() * 18 - 9).toFixed(1)}deg)`;
      card.innerHTML = passFaceHtml(d.item, "rv-face");
      pile.appendChild(card);
      while(pile.children.length > 7) pile.removeChild(pile.firstChild);
      badge.textContent = counts.new[type];
    } else {
      counts.dupe[type]++;
      if(!firstDupe[type]){            // le premier doublon tiré donne sa forme à l'emplacement
        firstDupe[type] = firstDupeItem[type];
        const card = document.createElement("div");
        card.className = "rv-card dupe" + (animate ? " pop" : "");
        card.dataset.id = firstDupeItem[type].id;
        card.innerHTML = passFaceHtml(firstDupeItem[type], "rv-face");
        pile.appendChild(card);
      }
      badge.textContent = "×" + counts.dupe[type];
    }
    badge.classList.add("on");
    if(animate){ badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump"); }
  };

  const finish = ()=>{
    if(finished) return;
    finished = true;
    cfg.draws.forEach((_, i)=>apply(i, false));
    overlay.querySelectorAll(".rv-fly").forEach(el=>{ el.getAnimations().forEach(a=>a.cancel()); el.remove(); });
    const b = $("#rv-booster"); if(b){ b.classList.remove("shaking", "quick"); b.classList.add("opened"); }
    overlay.querySelectorAll(".rv-spot").forEach(el=>{ el.getAnimations({ subtree:true }).forEach(a=>a.cancel()); el.remove(); });
    const pc = $("#rv-packctr"); if(pc) pc.textContent = `Pack ${cfg.qty}/${cfg.qty}`;
    const nNew = cfg.draws.filter(d=>d.isNew).length, nDup = cfg.draws.length - nNew;
    $("#rv-sum").textContent = forge ? "Élément forgé !" : `${nNew} nouveau${nNew > 1 ? "x" : ""} · ${nDup} doublon${nDup > 1 ? "s" : ""}`;
    overlay.classList.add("done");
    btn.textContent = "Continuer";
    btn.focus({ preventScroll:true });
  };
  const close = ()=>{
    if(closed) return;
    closed = true;
    document.removeEventListener("keydown", onKey, true);
    overlay.remove();
    if(cfg.done) cfg.done();
  };
  const skipOrClose = ()=>{
    if(finished){ close(); return; }
    skipped = true; skipResolve(); finish();
  };
  const onKey = (e)=>{
    if(e.key === "Escape" || e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); skipOrClose(); }
  };
  document.addEventListener("keydown", onKey, true);
  btn.addEventListener("click", (e)=>{ e.stopPropagation(); skipOrClose(); });
  overlay.addEventListener("mousedown", (e)=>{ if(!finished && !btn.contains(e.target)){ skipped = true; skipResolve(); finish(); } });

  if(reduce){ finish(); return; }

  // ---------- forge : éclair puis forme ----------
  if(forge){
    const item = cfg.draws[0].item;
    const card = $("#rv-forge-card");
    card.innerHTML = passFaceHtml(item, "rv-face big");
    card.classList.add("show");
    $(".rv-forge-flash").classList.add("go");
    await sleepS(1300);
    finish();
    return;
  }

  // ---------- booster : entrée, secousses, ouverture ----------
  const booster = $("#rv-booster");
  booster.classList.add("enter");
  await sleepS(450);
  if(!skipped){ booster.classList.remove("enter"); booster.classList.add("shaking"); await sleepS(1150); }
  if(!skipped){ booster.classList.remove("shaking"); booster.classList.add("opening"); await sleepS(650); }

  // ---------- sortie des formes ----------
  const flights = [];
  // une forme sort du booster et rejoint sa pile (ou l'emplacement des doublons)
  const flyItem = (i, duration)=>{
    const d = cfg.draws[i];
    const from = booster.getBoundingClientRect();
    const slotEl = slotOf(d.isNew, d.item.type); if(d.item.type === "rare") overlay.classList.add("has-rare");
    const target = slotEl.querySelector(".rv-pile").getBoundingClientRect();
    const el = document.createElement("div");
    el.className = "rv-fly";
    el.innerHTML = passFaceHtml(d.item, "rv-face");
    el.style.left = (from.left + from.width / 2 - 28) + "px";
    el.style.top = (from.top + from.height / 2 - 28) + "px";
    overlay.appendChild(el);
    const dx = target.left + target.width / 2 - (from.left + from.width / 2);
    const dy = target.top + target.height / 2 - (from.top + from.height / 2);
    const up = -(60 + Math.random() * 30), side = Math.random() * 60 - 30;
    const anim = el.animate([
      { transform:"translate(0px,0px) scale(.2) rotate(-10deg)", opacity:0 },
      { transform:`translate(${side}px,${up}px) scale(1.25) rotate(${(Math.random() * 16 - 8).toFixed(1)}deg)`, opacity:1, offset:.3 },
      { transform:`translate(${dx}px,${dy}px) scale(.62) rotate(${(Math.random() * 20 - 10).toFixed(1)}deg)`, opacity:1 }
    ], { duration, easing:"cubic-bezier(.3,.7,.3,1)", fill:"forwards" });
    return anim.finished.then(()=>{ if(!finished){ el.remove(); apply(i, true); } }).catch(()=>{});
  };

  // ---------- projecteurs (nouvelle région / nouvelle exclusivité) ----------
  const spot = { n:0, max:5 };                         // projecteurs : au plus 5 par ouverture
  const landAll = async ()=>{ const f = flights.splice(0); await Promise.race([Promise.all(f), skipPromise]); };
  // nouvel élément spécial : il prend la lumière quelques instants (plus longtemps pour une exclusivité), puis rejoint sa pile
  const spotlight = async (i)=>{
    spot.n++;
    const d = cfg.draws[i], isRare = d.item.type === "rare";
    const el = document.createElement("div");
    el.className = "rv-spot" + (isRare ? " rare" : "");
    el.innerHTML = `<div class="rv-spot-card">${passFaceHtml(d.item, "rv-face")}</div><div class="rv-spot-label">${isRare ? "Exclusivité !" : "Nouvelle région !"}</div>${isRare ? `<div class="rv-spot-name">${d.item.label}</div>` : ""}`;
    overlay.appendChild(el);
    await sleepS(isRare ? 1700 : 300);
    if(!skipped){
      const card = el.querySelector(".rv-spot-card");
      const from = card.getBoundingClientRect();
      const slotEl = slotOf(true, d.item.type); if(d.item.type === "rare") overlay.classList.add("has-rare");
      const target = slotEl.querySelector(".rv-pile").getBoundingClientRect();
      el.querySelector(".rv-spot-label").style.opacity = 0;
      const nm = el.querySelector(".rv-spot-name"); if(nm) nm.style.opacity = 0;
      el.style.background = "transparent";
      el.classList.add("leaving");
      const anim = card.animate([
        { transform:"scale(1)", opacity:1 },
        { transform:`translate(${target.left + target.width / 2 - (from.left + from.width / 2)}px, ${target.top + target.height / 2 - (from.top + from.height / 2)}px) scale(.38)`, opacity:.9 }
      ], { duration:220, easing:"ease-in", fill:"forwards" });
      await Promise.race([anim.finished.catch(()=>{}), skipPromise]);
    }
    el.remove();
    if(!finished) apply(i, true);
  };

  // ---------- cascade : plusieurs packs ----------
  if(cfg.cascade){
    const isRegion = (i)=>{ const t = cfg.draws[i].item.type; return t === "region" || t === "rare"; };   // éléments « spéciaux »
    const idxOf = (c)=>Array.from({ length:c.end - c.start }, (_, k)=>c.start + k);
    const packCtr = $("#rv-packctr"), qtyBadge = $(".rv-b-qty");
    const setCtr = (n)=>{ if(packCtr) packCtr.textContent = `Pack ${Math.min(n, cfg.qty)}/${cfg.qty}`; };

    // 1er pack : mise en scène complète ; les nouvelles régions arrivent en finale
    const hero = idxOf(cfg.chunks[0]);
    const heroNon = hero.filter(i=>!isRegion(i)), heroReg = hero.filter(isRegion);
    const flyList = heroNon.slice(0, 36);
    const heroGap = Math.max(40, Math.min(140, Math.round(1400 / Math.max(1, flyList.length))));
    for(let k = 0; k < flyList.length && !skipped; k++){
      flights.push(flyItem(flyList[k], 560));
      await sleepS(heroGap);
    }
    await landAll();
    if(!skipped) heroNon.slice(36).forEach(i=>apply(i, false));
    for(const i of heroReg){
      if(skipped) break;
      if(cfg.draws[i].isNew && spot.n < spot.max) await spotlight(i);
      else { flights.push(flyItem(i, 560)); await sleepS(150); }
    }
    await landAll();

    // packs suivants : boosters rapides, durée totale plafonnée (~3,6 s)
    const rest = cfg.chunks.slice(1);
    const MIN_BEAT = 230;
    const beats = Math.max(1, Math.min(rest.length, Math.floor(3600 / MIN_BEAT)));
    const per = Math.ceil(rest.length / beats);
    const beatMs = Math.max(MIN_BEAT, Math.min(500, Math.round(3600 / beats)));
    let opened = 1;
    for(let b = 0; b < beats && !skipped; b++){
      const group = rest.slice(b * per, (b + 1) * per);
      if(!group.length) break;
      const idxs = group.flatMap(idxOf);
      opened += group.length;
      // le booster "re-tape" : nouveau pack, éclair court
      booster.classList.remove("opened", "opening", "quick");
      void booster.offsetWidth;
      booster.classList.add("quick");
      setCtr(opened);
      if(qtyBadge){ const left = cfg.qty - opened; qtyBadge.textContent = left > 0 ? "×" + left : ""; qtyBadge.style.display = left > 0 ? "" : "none"; }
      const non = idxs.filter(i=>!isRegion(i)), regs = idxs.filter(isRegion);
      const step = Math.max(1, Math.ceil(non.length / 8));          // au plus 8 formes en vol par pack/groupe
      const shown = non.filter((_, k)=>k % step === 0).slice(0, 8);
      const shownSet = new Set(shown);
      shown.forEach((i, k)=>{
        flights.push((async()=>{ await sleepS(Math.round(k * beatMs / (shown.length + 1))); if(!skipped) await flyItem(i, 420); })());
      });
      await sleepS(beatMs);
      non.forEach(i=>{ if(!shownSet.has(i)) apply(i, false); });
      for(const i of regs){
        if(skipped) break;
        if(cfg.draws[i].isNew && spot.n < spot.max) await spotlight(i);
        else flights.push(flyItem(i, 420));
      }
    }
    await landAll();
    if(!skipped){ booster.classList.add("opened"); await sleepS(250); }
    finish();
    return;
  }

  // ---------- un seul pack (ou cascade désactivée) ----------
  const nFly = Math.min(cfg.draws.length, RV_MAX_FLYING);
  for(let i = 0; i < nFly && !skipped; i++){
    const dr = cfg.draws[i];
    if(dr.item.type === "rare" && dr.isNew && spot.n < spot.max){      // nouvelle exclusivité : projecteur
      await landAll();
      if(!skipped) await spotlight(i);
      continue;
    }
    flights.push(flyItem(i, 720));
    await sleepS(cfg.interval);
  }
  if(!skipped) await Promise.race([Promise.all(flights), skipPromise]);
  if(!skipped){
    // au-delà de la limite d'éléments animés : ajout groupé
    for(let i = nFly; i < cfg.draws.length; i++) apply(i, false);
    booster.classList.add("opened");
    await sleepS(250);
  }
  finish();
}

function passChipHtml(it, tag){
  const code = it.code ? `<b>${it.code}</b> ` : "";
  const mark = tag === "new" ? `<i>NEW</i>` : "";
  return `<span class="pass-chip ${it.type} ${tag || ""}">${code}${it.label}${mark}</span>`;
}

// Journal du dernier tirage : un élément par pastille, groupé par type ;
// coloré si nouveau, terne si doublon, "×n" si obtenu plusieurs fois dans l'achat.
function passLogGroupsHtml(draws){
  const cat = passCatalog();
  const byItem = new Map();
  draws.forEach(d=>{
    const e = byItem.get(d.id);
    if(e) e.n++;
    else byItem.set(d.id, { item:cat.byId[d.id], isNew:d.isNew, n:1, order:byItem.size });
  });
  const groups = [["dept","Départements"],["chef","Chefs-lieux"],["region","Régions"],["rare","Exclusivités"]];
  return groups.map(([type, label])=>{
    const list = [...byItem.values()].filter(e=>e.item.type === type);
    if(!list.length) return "";
    list.sort((x, y)=> (y.isNew - x.isNew) || (cat.all.indexOf(x.item) - cat.all.indexOf(y.item)));
    const nNew = list.filter(e=>e.isNew).length;
    const nDup = list.reduce((a, e)=>a + e.n, 0) - nNew;   // cohérent avec le résumé : on compte les tirages
    const chips = list.map(e=>{
      const code = e.item.code ? `<b>${e.item.code}</b>` : "";
      return `<span class="pl-chip ${e.isNew ? "new" : "dupe"}">${code}${e.item.label}${e.n > 1 ? `<i>×${e.n}</i>` : ""}</span>`;
    }).join("");
    return `<div class="pl-group t-${type}">
      <div class="pl-gtitle">${label}<i>${nNew} nouveau${nNew > 1 ? "x" : ""} · ${nDup} doublon${nDup > 1 ? "s" : ""}</i></div>
      <div class="pl-chips">${chips}</div>
    </div>`;
  }).join("");
}

function passResultHtml(r){
  if(!r) return "";
  let title, summary = "", body = "";
  if(r.kind === "buy"){
    title = `${r.pack.name}${r.qty > 1 ? ` ×${r.qty}` : ""}`;
    summary = `${r.newCount} nouveau${r.newCount > 1 ? "x" : ""} · ${r.dupCount} doublon${r.dupCount > 1 ? "s" : ""}`;
    body = passLogGroupsHtml(r.draws);
  } else if(r.kind === "forge"){
    title = "Faussaire";
    summary = "1 nouveau";
    body = passLogGroupsHtml([{ id:r.item.id, isNew:true }]);
  } else if(r.kind === "sell"){
    title = "Vente de doublons";
    summary = `${r.count} doublon${r.count > 1 ? "s" : ""} vendu${r.count > 1 ? "s" : ""} · +${brossardAmountHtml(r.value)}`;
  }
  return `
    <details class="card pass-log" id="pass-result" ${passUi.logOpen ? "open" : ""}>
      <summary><span class="pl-title">${title}</span><span class="pl-sum">${summary}</span><span class="pl-chev">▾</span></summary>
      ${body ? `<div class="pl-body">${body}</div>` : ""}
    </details>`;
}

function passTileHtml(it, owned){
  const cls = ["pass-tile", it.type, owned ? "owned" : "locked"];
  if(passUi.forge && !owned && it.type !== "rare") cls.push("pickable");
  if(passUi.forgeSel === it.id) cls.push("selected");
  let inner;
  if(it.type === "rare"){
    inner = `<span class="rare-ic">${owned ? (it.kind === "fond" ? "🖼️" : "🎨") : "✦"}</span>
             <span class="pass-tile-wrap">
               <span class="pass-tile-name">${owned ? it.label : "???"}</span>
               <span class="pass-tile-sub">${owned ? it.blurb : "Exclusivité · tirage rare dans les gros packs"}</span>
             </span>`;

    inner = `<span class="pass-tile-name">${it.label}</span>
             <span class="pass-tile-sub">${owned ? it.count + " dép." : "Non obtenue"}</span>`;
  } else {
    inner = `<span class="plate-badge">${it.code}</span>
             <span class="pass-tile-wrap">
               <span class="pass-tile-name">${owned ? it.label : "???"}</span>
               ${owned && it.type === "chef" ? `<span class="pass-tile-sub">${it.deptNom}</span>` : ""}

  return `<div class="${cls.join(" ")}" data-id="${it.id}">${inner}</div>`;
}
