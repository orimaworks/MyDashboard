<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🇫🇷 GeoFR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1520;
    --panel:#161f30;
    --panel-light:#1d2a41;
    --line:#2b3a58;
    --amber:#c9903f;
    --amber-soft:rgba(201,144,63,0.16);
    --ok:#4c9a6a;
    --ok-soft:rgba(76,154,106,0.15);
    --bad:#b4483a;
    --bad-soft:rgba(180,72,58,0.15);
    --text:#e7e2d3;
    --text-dim:#93a0b8;
    --plate-blue:#122548;
    --plate-border:#33507e;
    --plate-text:#dbe6ff;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  /* =========================================================
     PALETTES (thèmes cosmétiques, déblocables par niveau)
     Origine = palette par défaut définie dans :root ci-dessus (inchangée).
     Les 5 suivantes sont volontairement plus saturées/pétantes.
     ========================================================= */
  html[data-theme="violette"]{
    --ink:#150a24; --panel:#22103d; --panel-light:#2f1650; --line:#4a1f7a;
    --amber:#ff3ec8; --amber-soft:rgba(255,62,200,0.18);
    --text:#f5e9ff; --text-dim:#b48fd9;
    --plate-blue:#3a1568; --plate-border:#6b2ba8; --plate-text:#ffe0fa;
  }
  html[data-theme="emeraude"]{
    --ink:#051a10; --panel:#0c2c1c; --panel-light:#123d26; --line:#1d5c3a;
    --amber:#00e68a; --amber-soft:rgba(0,230,138,0.18);
    --text:#e3fff0; --text-dim:#6fbf96;
    --plate-blue:#0a3d28; --plate-border:#16694a; --plate-text:#d0ffe8;
  }
  html[data-theme="bordeaux"]{
    --ink:#200811; --panel:#3a0f1e; --panel-light:#4d1428; --line:#7a2140;
    --amber:#ff2d55; --amber-soft:rgba(255,45,85,0.18);
    --text:#ffe4ec; --text-dim:#d98aa0;
    --plate-blue:#4a0f28; --plate-border:#7a1d45; --plate-text:#ffd9e8;
  }
  html[data-theme="abysses"]{
    --ink:#041018; --panel:#082230; --panel-light:#0d3040; --line:#164a5c;
    --amber:#00d9ff; --amber-soft:rgba(0,217,255,0.18);
    --text:#e0fbff; --text-dim:#5fb8cc;
    --plate-blue:#0a3d50; --plate-border:#17708c; --plate-text:#d0f7ff;
  }
  html[data-theme="cadastre"]{
    --ink:#f2e9d0; --panel:#ecdfc0; --panel-light:#e2d2a8; --line:#cbb872;
    --amber:#e8590c; --amber-soft:rgba(232,89,12,0.16);
    --ok:#1f9d55; --ok-soft:rgba(31,157,85,0.14);
    --bad:#d81e3f; --bad-soft:rgba(216,30,63,0.14);
    --text:#241a0a; --text-dim:#6b5a3a;
    --plate-blue:#142850; --plate-border:#2a4a8c; --plate-text:#dce8ff;
  }
  /* Aurore Boréale — thème fantaisiste : fond en dégradé animé façon aurores polaires */
  html[data-theme="aurore"]{
    --ink:#0a0e1f; --panel:#17123a; --panel-light:#221a52; --line:#3a2d78;
    --amber:#39ffb0; --amber-soft:rgba(57,255,176,0.18);
    --text:#eaf0ff; --text-dim:#8f93c9;
    --plate-blue:#241a5c; --plate-border:#4530a0; --plate-text:#e8e6ff;
  }
  html[data-theme="aurore"] body{
    background:linear-gradient(-45deg, #0a0e1f, #142a3d, #1a0f3d, #0a2e2a, #0a0e1f);
    background-size:400% 400%;
    animation:auroraShift 12s ease infinite;
  }
  /* boutons d'action : même dégradé animé, mais en décalé (déphasé) par rapport au fond */
  html[data-theme="aurore"] button.primary{
    background:linear-gradient(-45deg, #39ffb0, #4dd8ff, #a98bff, #39ffb0);
    background-size:400% 400%;
    animation:auroraShift 12s ease infinite;
    animation-delay:-5s;
  }
  @media (prefers-reduced-motion: reduce){
    html[data-theme="aurore"] body, html[data-theme="aurore"] button.primary{animation:none;}
  }
  @keyframes auroraShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* =========================================================
     PALETTES EXCLUSIVES (Pass Navi'go) — obtenues uniquement en tirage rare.
     Elles restent compatibles avec les fonds : les décors animés passent au-dessus
     du pavage (z-index -1, après le <svg>) et sous le contenu ; les tuiles utilisent
     --panel-light / --line / --plate-blue comme pour toutes les autres palettes.
     ========================================================= */

  /* Braise — nuit de forge : lueur de four en bas, braises qui montent */
  html[data-theme="braise"]{
    --ink:#120807; --panel:#211210; --panel-light:#301b15; --line:#5e301d;
    --amber:#ff7a1a; --amber-soft:rgba(255,122,26,0.18);
    --text:#ffeedd; --text-dim:#c9a086;
    --plate-blue:#3b1b11; --plate-border:#8f4220; --plate-text:#ffe2bf;
  }
  html[data-theme="braise"] body::before{
    content:""; position:fixed; left:0; right:0; bottom:0; height:62vh; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 100%, rgba(255,92,18,.34), rgba(255,92,18,.10) 45%, transparent 72%);
    animation:braiseGlow 4.5s ease-in-out infinite alternate;
  }
  html[data-theme="braise"] body::after{
    content:""; position:fixed; left:0; right:0; top:0; height:calc(100% + 480px); z-index:-1; pointer-events:none;
    background-size:480px 480px;
    background-image:
      radial-gradient(circle at 71% 58%, rgba(255,120,34,0.79) 0, rgba(255,120,34,0.79) 1.7px, rgba(255,120,34,0) 3.3px),
      radial-gradient(circle at 95% 95%, rgba(255,120,34,0.73) 0, rgba(255,120,34,0.73) 1.4px, rgba(255,120,34,0) 3.0px),
      radial-gradient(circle at 8% 36%, rgba(255,214,128,0.83) 0, rgba(255,214,128,0.83) 1.3px, rgba(255,214,128,0) 2.9px),
      radial-gradient(circle at 69% 45%, rgba(255,214,128,0.98) 0, rgba(255,214,128,0.98) 1.5px, rgba(255,214,128,0) 3.1px),
      radial-gradient(circle at 56% 22%, rgba(255,176,70,0.74) 0, rgba(255,176,70,0.74) 1.9px, rgba(255,176,70,0) 3.5px),
      radial-gradient(circle at 30% 24%, rgba(255,214,128,0.87) 0, rgba(255,214,128,0.87) 1.8px, rgba(255,214,128,0) 3.4px),
      radial-gradient(circle at 92% 31%, rgba(255,176,70,0.96) 0, rgba(255,176,70,0.96) 1.2px, rgba(255,176,70,0) 2.8px),
      radial-gradient(circle at 86% 13%, rgba(255,176,70,0.85) 0, rgba(255,176,70,0.85) 1.2px, rgba(255,176,70,0) 2.8px),
      radial-gradient(circle at 65% 86%, rgba(255,176,70,0.9) 0, rgba(255,176,70,0.9) 1.9px, rgba(255,176,70,0) 3.5px),
      radial-gradient(circle at 57% 69%, rgba(255,176,70,0.83) 0, rgba(255,176,70,0.83) 1.8px, rgba(255,176,70,0) 3.4px),
      radial-gradient(circle at 78% 11%, rgba(255,214,128,0.81) 0, rgba(255,214,128,0.81) 1.8px, rgba(255,214,128,0) 3.4px),
      radial-gradient(circle at 66% 52%, rgba(255,176,70,0.96) 0, rgba(255,176,70,0.96) 1.5px, rgba(255,176,70,0) 3.1px),
      radial-gradient(circle at 35% 19%, rgba(255,176,70,0.86) 0, rgba(255,176,70,0.86) 1.5px, rgba(255,176,70,0) 3.1px),
      radial-gradient(circle at 51% 12%, rgba(255,120,34,0.76) 0, rgba(255,120,34,0.76) 1.2px, rgba(255,120,34,0) 2.8px);
    animation:emberRise 26s linear infinite, emberSway 7s ease-in-out infinite alternate;
  }
  html[data-theme="braise"]::after{
    content:""; position:fixed; left:0; right:0; top:0; height:calc(100% + 600px); z-index:-1; pointer-events:none;
    background-size:600px 600px; filter:blur(.6px);
    background-image:
      radial-gradient(circle at 82% 76%, rgba(255,110,30,0.34) 0, rgba(255,110,30,0.34) 3.6px, rgba(255,110,30,0) 5.2px),
      radial-gradient(circle at 44% 49%, rgba(255,150,60,0.3) 0, rgba(255,150,60,0.3) 3.1px, rgba(255,150,60,0) 4.7px),
      radial-gradient(circle at 78% 79%, rgba(255,150,60,0.28) 0, rgba(255,150,60,0.28) 4.1px, rgba(255,150,60,0) 5.7px),
      radial-gradient(circle at 49% 7%, rgba(255,150,60,0.38) 0, rgba(255,150,60,0.38) 3.4px, rgba(255,150,60,0) 5.0px),
      radial-gradient(circle at 11% 30%, rgba(255,110,30,0.44) 0, rgba(255,110,30,0.44) 3.1px, rgba(255,110,30,0) 4.7px),
      radial-gradient(circle at 67% 7%, rgba(255,110,30,0.37) 0, rgba(255,110,30,0.37) 3.7px, rgba(255,110,30,0) 5.3px),
      radial-gradient(circle at 80% 55%, rgba(255,150,60,0.49) 0, rgba(255,150,60,0.49) 2.9px, rgba(255,150,60,0) 4.5px);
    animation:emberRiseSlow 44s linear infinite, emberSway 11s ease-in-out infinite alternate-reverse;
  }
  html[data-theme="braise"] button.primary{
    background:linear-gradient(180deg,#ffa63c,#ff6a10); color:#2a0f02;
    box-shadow:0 0 16px rgba(255,110,20,.35);
  }
  @keyframes braiseGlow{from{opacity:.6;} to{opacity:1;}}
  @keyframes emberRise{from{transform:translateY(0);} to{transform:translateY(-480px);}}
  @keyframes emberRiseSlow{from{transform:translateY(0);} to{transform:translateY(-600px);}}
  @keyframes emberSway{from{translate:-16px 0;} to{translate:16px 0;}}

  /* Prisme — holographique : la teinte --ph glisse lentement sur tout le spectre
     (palette entière + fond en pavage, qui change de couleur avec elle) */
  @property --ph{ syntax:"<angle>"; inherits:true; initial-value:210deg; }
  html[data-theme="prisme"]{
    animation:prismeCycle 160s steps(320) infinite;     /* ~2 mises à jour / seconde : léger pour la batterie */
    --ink:hsl(calc(var(--ph) + 30deg) 42% 6%);
    --panel:hsl(calc(var(--ph) + 30deg) 36% 11%);
    --panel-light:hsl(calc(var(--ph) + 30deg) 34% 17%);
    --line:hsl(calc(var(--ph) + 30deg) 40% 29%);
    --amber:hsl(var(--ph) 95% 64%); --amber-soft:hsl(var(--ph) 95% 64% / 0.18);
    --text:#f3f2ff; --text-dim:hsl(calc(var(--ph) + 30deg) 25% 72%);
    --plate-blue:hsl(calc(var(--ph) + 60deg) 50% 22%);
    --plate-border:hsl(calc(var(--ph) + 60deg) 55% 42%);
    --plate-text:hsl(calc(var(--ph) + 60deg) 100% 92%);
  }
  html[data-theme="prisme"] body{
    background:linear-gradient(135deg, var(--ink), hsl(calc(var(--ph) + 120deg) 45% 10%)) fixed;
  }
  html[data-theme="prisme"] body::after{
    content:""; position:fixed; top:0; bottom:0; left:-100%; width:300%; z-index:-1; pointer-events:none;
    background:linear-gradient(105deg, transparent 40%, hsl(var(--ph) 100% 85% / .07) 48%, hsl(calc(var(--ph) + 90deg) 100% 80% / .09) 52%, transparent 60%);
    animation:prismeSheen 15s ease-in-out infinite alternate;
  }
  html[data-theme="prisme"] button.primary{
    background:linear-gradient(110deg, hsl(var(--ph) 95% 64%), hsl(calc(var(--ph) + 70deg) 95% 64%)); color:#10101a;
  }
  @keyframes prismeCycle{from{--ph:0deg;} to{--ph:360deg;}}
  @keyframes prismeSheen{from{transform:translateX(-18%);} to{transform:translateX(18%);}}
  @media (prefers-reduced-motion: reduce){
    html[data-theme="braise"] body::before, html[data-theme="braise"] body::after, html[data-theme="braise"]::after,
    html[data-theme="prisme"], html[data-theme="prisme"] body::after{animation:none;}
  }

  /* =========================================================
     8-BIT — palette cachée (code Konami). Vieille console : couleurs NES, police pixel,
     angles droits, ombres dures, et juste ce qu'il faut de CRT (lignes de balayage,
     vignettage, frange RVB, scintillement et bande de rafraîchissement très discrets).
     Compatible avec les fonds : le pavage passe en bords crénelés ; le CRT est au-dessus de tout
     mais ne bloque aucun clic.
     ========================================================= */
  html[data-theme="8bit"]{
    --ink:#0a0a1f; --panel:#14143c; --panel-light:#1f1f66; --line:#4040c0;
    --amber:#f8b800; --amber-soft:rgba(248,184,0,0.20);
    --ok:#00a800; --ok-soft:rgba(0,168,0,0.20); --bad:#d82800; --bad-soft:rgba(216,40,0,0.20);
    --text:#fcfcfc; --text-dim:#9ca8fc;
    --plate-blue:#1c1c8c; --plate-border:#6888fc; --plate-text:#fcfcfc;
    --radius:0px;
  }
  html[data-theme="8bit"] body{
    background-color:var(--ink);
    background-image:linear-gradient(rgba(156,168,252,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(156,168,252,.045) 1px, transparent 1px);
    background-size:8px 8px; background-attachment:fixed;
    font-size:19px; letter-spacing:.2px;
    text-shadow:-1px 0 rgba(255,0,60,.22), 1px 0 rgba(0,200,255,.22);      /* frange RVB, à peine visible */
    -webkit-font-smoothing:none; text-rendering:optimizeSpeed;
  }
  html[data-theme="8bit"] *{
    font-family:'VT323','Courier New',monospace !important;
    border-radius:0 !important;
    transition-timing-function:steps(4) !important;
  }
  html[data-theme="8bit"] h1, html[data-theme="8bit"] h2, html[data-theme="8bit"] h3,
  html[data-theme="8bit"] .brand, html[data-theme="8bit"] .section-title, html[data-theme="8bit"] nav.tabs button,
  html[data-theme="8bit"] button.primary, html[data-theme="8bit"] .theme-name{
    font-family:'Press Start 2P','Courier New',monospace !important; line-height:1.5; letter-spacing:0;
  }
  html[data-theme="8bit"] h1{font-size:19px !important;}
  html[data-theme="8bit"] h2, html[data-theme="8bit"] .section-title{font-size:13px !important;}
  html[data-theme="8bit"] h3{font-size:11px !important;}
  html[data-theme="8bit"] .brand{font-size:16px !important;}
  html[data-theme="8bit"] nav.tabs button{font-size:9px !important; text-transform:uppercase;}
  html[data-theme="8bit"] button.primary{font-size:11px !important; text-transform:uppercase;}
  html[data-theme="8bit"] .theme-name{font-size:10px !important;}
  html[data-theme="8bit"] button, html[data-theme="8bit"] input, html[data-theme="8bit"] select, html[data-theme="8bit"] textarea,
  html[data-theme="8bit"] .card, html[data-theme="8bit"] .modal-box, html[data-theme="8bit"] .theme-card, html[data-theme="8bit"] .pass-tile{
    border-width:2px !important;
  }
  html[data-theme="8bit"] .card, html[data-theme="8bit"] .modal-box, html[data-theme="8bit"] button.primary{
    box-shadow:4px 4px 0 rgba(0,0,0,.7) !important;
  }
  html[data-theme="8bit"] button:active{transform:translate(3px,3px); box-shadow:none !important;}
  html[data-theme="8bit"] #bg-mosaic{shape-rendering:crispEdges;}
  /* CRT : balayage + vignettage (::after), bande de rafraîchissement (::before) */
  html[data-theme="8bit"] body::after{
    content:""; position:fixed; inset:0; z-index:9998; pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.15) 2px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.4) 100%);
    animation:crtFlicker 6s steps(1) infinite;
  }
  html[data-theme="8bit"] body::before{
    content:""; position:fixed; left:0; right:0; top:-22vh; height:20vh; z-index:9997; pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(160,180,255,.05), transparent);
    animation:crtRoll 10s linear infinite;
  }
  @keyframes crtFlicker{0%{opacity:1;} 91%{opacity:.9;} 92%{opacity:1;} 96%{opacity:.94;} 97%{opacity:1;}}
  @keyframes crtRoll{from{transform:translateY(0);} to{transform:translateY(140vh);}}
  @media (prefers-reduced-motion: reduce){
    html[data-theme="8bit"] body::before{display:none;}
    html[data-theme="8bit"] body::after{animation:none;}
  }

  /* Easter egg « code Konami » (indépendant de la palette) : ambiance Gradius — étoiles qui défilent,
     jauge de bonus qui s'allume, gros titre, secousse et flashs */
  .kn-overlay{position:fixed; inset:0; z-index:960; background:#02020a; display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-family:'Press Start 2P','Courier New',monospace; color:#fcfcfc; text-align:center; text-shadow:none;}
  .kn-overlay::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.32) 2px 3px);}
  .kn-overlay.out{opacity:0; transition:opacity .3s steps(4);}
  .kn-stars{position:absolute; top:0; bottom:0; left:0; width:calc(100% + 240px); background-size:240px 240px;
    background-image:
      radial-gradient(circle at 10% 20%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 35% 70%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 60% 35%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 85% 80%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 22% 90%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 72% 12%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 92% 50%, #fff 0 1.2px, transparent 2px);
    animation:knStars 1.4s linear infinite;}
  .kn-stars.s2{width:calc(100% + 320px); background-size:320px 320px; opacity:.6;
    background-image:
      radial-gradient(circle at 15% 55%, #9ca8fc 0 1px, transparent 1.8px),
      radial-gradient(circle at 45% 15%, #9ca8fc 0 1px, transparent 1.8px),
      radial-gradient(circle at 70% 65%, #9ca8fc 0 1px, transparent 1.8px),
      radial-gradient(circle at 30% 40%, #9ca8fc 0 1px, transparent 1.8px),
      radial-gradient(circle at 88% 25%, #9ca8fc 0 1px, transparent 1.8px),
      radial-gradient(circle at 55% 92%, #9ca8fc 0 1px, transparent 1.8px);
    animation:knStars2 3.2s linear infinite;}
  @keyframes knStars{to{transform:translateX(-240px);}}
  @keyframes knStars2{to{transform:translateX(-320px);}}
  .kn-flash, .kn-flash2{position:absolute; inset:0; z-index:4; pointer-events:none;}
  .kn-flash{background:#fff; animation:knFlash .5s steps(5) forwards;}
  .kn-flash2{background:#f8b800; opacity:0; animation:knFlash2 .45s steps(5) 4.1s forwards;}
  @keyframes knFlash{to{opacity:0; visibility:hidden;}}
  @keyframes knFlash2{0%{opacity:.6;} 100%{opacity:0;}}
  .kn-box{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:clamp(18px, 4vh, 34px); padding:0 14px; width:100%;}
  .kn-big{display:flex; flex-direction:column; align-items:center; gap:14px; animation:knShake .5s steps(10) 2.5s both;}
  @keyframes knShake{0%,100%{transform:none;} 20%{transform:translate(-5px,3px);} 40%{transform:translate(5px,-4px);} 60%{transform:translate(-4px,-3px);} 80%{transform:translate(4px,4px);}}
  .kn-line{display:block; white-space:nowrap; width:calc(var(--n) * 1ch); line-height:1.15;
    font-size:min(var(--fs, 12px), calc((100vw - 28px) / var(--n)));
    animation:knType calc(var(--n) * var(--sp, .07s)) steps(var(--n)) var(--d) both;}
  @keyframes knType{from{clip-path:inset(-8px 100% -8px 0);} to{clip-path:inset(-8px -2ch -8px 0);}}   /* marge finale : ne rogne pas le dernier caractère / l'ombre */
  .kn-l1{--fs:16px; color:#9ca8fc;}
  .kn-lA{--fs:64px; --sp:.12s; color:#fcfcfc; text-shadow:5px 5px 0 #1c1c8c;}
  .kn-lB{--fs:46px; --sp:.1s; color:#f8b800; text-shadow:5px 5px 0 #a81000;
    animation-name:knType, knHue; animation-duration:calc(var(--n) * var(--sp)), .8s;
    animation-timing-function:steps(var(--n)), steps(1); animation-delay:var(--d), calc(var(--d) + var(--n) * var(--sp) + .1s);
    animation-iteration-count:1, infinite; animation-fill-mode:both, none;}
  @keyframes knHue{0%{color:#f8b800;} 25%{color:#fc7460;} 50%{color:#fcfc54;} 75%{color:#f8d878;}}
  .kn-meter{display:flex; gap:6px; width:min(380px, calc(100vw - 28px));}
  .kn-cell{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .kn-cell i{display:block; width:100%; height:26px; background:#10102c; border:3px solid #3a3aa8;
    animation:knCell .01s step-start calc(2.9s + var(--i) * .25s) forwards;}
  .kn-cell span{font-size:min(7px, 1.8vw); color:#9ca8fc; opacity:0; animation:knLabel .01s step-start calc(2.9s + var(--i) * .25s) forwards;}
  @keyframes knCell{to{background:#f8b800; border-color:#fcfcfc; box-shadow:0 0 0 3px #a81000;}}
  @keyframes knLabel{to{opacity:1;}}
  .kn-l3{--fs:12px; --sp:.05s; color:#58f858;}
  .kn-l4{--fs:9px; width:auto; color:#fcfcfc; opacity:0; animation:knBlink 1s steps(1) 5.9s infinite;}
  @keyframes knBlink{0%{opacity:1;} 50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .kn-line, .kn-big, .kn-cell i, .kn-cell span, .kn-stars{animation:none;}
    .kn-line{clip-path:none;} .kn-cell i{background:#f8b800; border-color:#fcfcfc;} .kn-cell span, .kn-l4{opacity:1;}
    .kn-flash, .kn-flash2{display:none;}
  }

  .app-version-row{display:flex; justify-content:flex-end; margin-top:22px;}
  .app-version{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-dim); opacity:.6; cursor:default; user-select:none; -webkit-user-select:none;}
  /* Fond « mosaïque » : un département répété en pavage, aux couleurs de la palette active */
  #bg-mosaic{position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; opacity:.85;}
  html[data-bg] .card{background:color-mix(in srgb, var(--panel) 87%, transparent);}
  .bg-locked{display:flex; align-items:center; gap:10px; width:100%; margin-top:6px; padding:12px 14px; border:1px dashed var(--line); border-radius:10px; background:var(--panel-light); color:var(--text-dim); cursor:pointer; font-size:14px;}
  .bg-locked .lock-ic{margin:0;}
  .bg-row{display:flex; align-items:center; gap:12px;}
  /* même apparence que « Mon département » (form.settings select) */
  .bg-field label{display:block; font-size:13px; color:var(--text-dim); margin:14px 0 5px;}
  .bg-row select{
    flex:1; min-width:0; max-width:none;
    font-family:'Source Sans 3', sans-serif; font-size:15px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 12px;
  }
  .bg-row select:focus{outline:none; border-color:var(--amber);}
  .bg-preview{flex:0 0 72px; width:72px; height:72px; border:1px solid var(--line); border-radius:10px; background:var(--ink); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .bg-preview svg{width:100%; height:100%; display:block;}
  html{height:-webkit-fill-available;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 800px at 50% -10%, rgba(201,144,63,0.06), transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:'Source Sans 3', system-ui, sans-serif;
    min-height:100vh;
    min-height:-webkit-fill-available; /* évite le saut de hauteur avec la barre Safari iOS */
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px calc(60px + env(safe-area-inset-bottom, 0px));
    overscroll-behavior-y:contain; /* évite le rebond/pull-to-refresh gênant sur iOS */
    -webkit-text-size-adjust:100%;
  }
  button, .mode-btn, .choice-btn, .keypad-key, .cheat-item, nav.tabs button, .gear-btn{
    touch-action:manipulation; /* supprime le délai de tap et le double-tap zoom sur iOS */
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app{width:100%; max-width:720px;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:14px; margin-bottom:22px;
    flex-wrap:wrap; gap:10px;
  }
  .brand{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.02em;
    color:var(--text);
    display:flex; align-items:center; gap:10px;
  }
  nav.tabs{display:flex; gap:4px;}
  nav.tabs button{
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:transparent;
    border:none;
    color:var(--text-dim);
    padding:8px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--amber); border-bottom-color:var(--amber);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px;
    margin-bottom:18px;
  }

  .muted{color:var(--text-dim);}
  .center{text-align:center;}

  /* ---------- Accueil ---------- */
  .hero-num{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    color:var(--amber);
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:34px;
    margin:0 0 8px;
    letter-spacing:0.01em;
  }
  p.lead{color:var(--text-dim); font-size:16px; line-height:1.5; margin:0 0 20px;}
  h2.section-title{
    font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:20px;
    margin:28px 0 4px; color:var(--text);
    border-top:1px solid var(--line); padding-top:22px;
  }

  button.primary{
    font-family:'Barlow Condensed', sans-serif;
    font-size:19px;
    letter-spacing:0.03em;
    background:var(--amber);
    color:#1a1207;
    border:none;
    border-radius:8px;
    padding:13px 26px;
    cursor:pointer;
    font-weight:700;
    transition:transform .1s, filter .15s;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.5; cursor:not-allowed;}

  button.ghost{
    font-family:'Source Sans 3', sans-serif;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-size:14px;
  }
  button.ghost:hover{border-color:var(--amber); color:var(--amber);}
  button.ghost.danger:hover{border-color:var(--bad); color:var(--bad);}

  /* ---------- Jeu : en-tête de manche ---------- */
  .round-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px;
  }
  .round-count{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:0.05em;
  }
  .score-live{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--amber);
  }
  .progress-track{
    height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:24px;
  }
  .progress-fill{height:100%; background:var(--amber); transition:width .3s;}

  .dept-name{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:42px;
    text-align:center;
    margin:6px 0 2px;
    letter-spacing:0.01em;
  }
  .dept-region{
    text-align:center;
    font-family:'Source Sans 3', sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:24px;
  }

  .mode-row{
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  }
  .mode-btn{
    flex:1; min-width:140px;
    background:var(--panel-light);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 10px;
    color:var(--text);
    cursor:pointer;
    text-align:center;
    transition:border-color .15s, background .15s;
  }
  .mode-btn:hover{border-color:var(--amber); background:#22314c;}
  .mode-btn .m-title{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700; font-size:20px; letter-spacing:0.02em;
  }
  .mode-btn .m-pts{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--amber); margin-top:4px;
  }
  .mode-btn .m-desc{font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.4;}

  .choices{
    display:grid; gap:10px;
    grid-template-columns:1fr 1fr;
  }
  .choices.single-col{grid-template-columns:1fr;}
  .choice-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--panel-light);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 10px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .choice-btn:hover{border-color:var(--amber);}
  .choice-btn.correct{border-color:var(--ok); background:var(--ok-soft);}
  .choice-btn.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .choice-btn:disabled{cursor:default;}
  .flash-ok{border-color:var(--ok) !important; background:var(--ok-soft) !important; transition:background .1s, border-color .1s;}
  .flash-bad{border-color:var(--bad) !important; background:var(--bad-soft) !important; transition:background .1s, border-color .1s;}
  .plate-badge{
    background:var(--plate-blue);
    border:1px solid var(--plate-border);
    border-radius:5px;
    padding:4px 9px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:17px;
    color:var(--plate-text);
    letter-spacing:0.03em;
  }
  .choice-name{font-size:15px; color:var(--text);}

  .cash-form{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .cash-form input{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    background:var(--panel-light);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    padding:12px 14px;
    width:140px;
    text-align:center;
    letter-spacing:0.06em;
  }
  .cash-form input:focus{outline:none; border-color:var(--amber);}

  /* ---------- Pavé tactile mobile (Cash) ---------- */
  .cash-desktop{display:block;  text-align: center;}
  .cash-mobile{display:none;}
  .keypad-display{
    display:block; text-align:center; font-size:28px; padding:14px;
    margin:0 auto 14px; min-height:24px; letter-spacing:0.12em;
  }
  .keypad-display.invalid{border-color:var(--bad); animation:shake .18s;}
  .keypad-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:14px;
  }
  .keypad-key{
    aspect-ratio:2/1; display:flex; align-items:center; justify-content:center;
    font-size:22px; border:none; cursor:pointer; user-select:none; width:100%;
    transition:transform .08s, filter .1s;
  }
  .keypad-action {display: flex}
  .keypad-key:active{transform:scale(0.93); filter:brightness(1.2);}
  .keypad-key.keypad-special-ab{
    background:#1d3f73; border-color:#4a6ea8; color:#eaf1ff;
  }
  .keypad-key.keypad-back{
    background:rgba(180,72,58,0.18); border:1px solid var(--bad); color:#e2897d; font-size:19px; width: 25%; margin-left: 5px;
  }

  .keypad-validate{width:75%; margin-right: 5px;}

  @media (max-width: 680px){
    .cash-desktop{display:none; text-align: center;}
    .cash-mobile{display:block;}
  }

  .feedback{
    margin-top:20px; padding:16px; border-radius:8px;
    text-align:center;
    font-size:15px;
  }
  .feedback.ok{background:var(--ok-soft); border:1px solid var(--ok);}
  .feedback.bad{background:var(--bad-soft); border:1px solid var(--bad);}
  .feedback .fb-title{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:22px; margin-bottom:4px;}

  .row-actions{display:flex; justify-content:center; margin-top:18px;}

  /* ---------- Récap ---------- */
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--text-dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.04em;}
  td.num{font-family:'JetBrains Mono', monospace;}
  .tag{
    display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px;
    font-family:'JetBrains Mono', monospace; letter-spacing:0.03em;
  }
  .tag.duo{background:rgba(147,164,184,0.15); color:#9aa4b8;}
  .tag.carre{background:var(--amber-soft); color:var(--amber);}
  .tag.cash{background:rgba(180,72,58,0.15); color:#e2897d;}
  .tag.passé{background:rgba(147,164,184,0.1); color:var(--text-dim); font-style:italic;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:20px;}
  .stat-box{background:var(--panel-light); border:1px solid var(--line); border-radius:8px; padding:14px;}
  .stat-box .v{font-family:'JetBrains Mono', monospace; font-size:24px; color:var(--amber);}
  .stat-grid-compact .stat-box{padding:11px;}
  .stat-grid-compact .stat-box .v{font-size:19px;}
  .stat-grid-compact .stat-box .l{font-size:11px;}
  .stat-box .l{font-size:12px; color:var(--text-dim); margin-top:2px;}

  form.settings label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:5px; margin-top:16px;}
  form.settings input[type="number"]{
    font-family:'JetBrains Mono', monospace;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 12px; width:100px; font-size:16px;
  }
  form.settings input[type="number"]:focus{outline:none; border-color:var(--amber);}
  form.settings select{
    font-family:'Source Sans 3', sans-serif; font-size:15px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 12px; width:100%; max-width:320px;
  }
  form.settings select:focus{outline:none; border-color:var(--amber);}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-top:16px;}
  .checkbox-row input{width:16px; height:16px;}
  .checkbox-row label{margin:0; font-size:14px; color:var(--text);}
  .btn-row{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}

  .empty{color:var(--text-dim); text-align:center; padding:30px 0; font-size:14px;}
  footer.note{color:var(--text-dim); font-size:12px; text-align:center; margin-top:10px; line-height:1.6;}

  /* ---------- Toast de réponse (pastille compacte, une ligne, non-bloquant) ---------- */
  .toast{
    position:fixed; bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); left:50%;
    transform:translate(-50%, 12px);
    background:var(--panel); border:1px solid var(--ok); border-radius:999px;
    padding:9px 18px; max-width:94vw;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    opacity:0; transition:opacity .2s ease, transform .2s ease;
    z-index:1000; pointer-events:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.bad{border-color:var(--bad);}
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .toast .toast-line{font-family:'Source Sans 3', sans-serif; font-weight:600; font-size:14px;}
  .toast.ok .toast-line{color:var(--ok);}
  .toast.bad .toast-line{color:#e2897d;}
  .toast .toast-code{font-family:'JetBrains Mono', monospace; color:var(--amber); font-weight:700;}
  .toast.achievement{border-color:#d4af37; box-shadow:0 8px 22px rgba(212,175,55,0.35);}
  .toast.achievement .toast-line{color:#e8c766;}

  /* ---------- Effet doré (achievement 100) ---------- */
  .shiny-gold{
    position:relative;
    border-color:#d4af37 !important;
    box-shadow:0 0 0 1px #d4af37, 0 0 18px rgba(212,175,55,0.45);
    background:linear-gradient(135deg, rgba(212,175,55,0.14), transparent 60%);
  }
  .shiny-gold::after{
    content:"✨"; position:absolute; top:6px; right:8px; font-size:13px;
  }

  /* ---------- Succès (achievements) ---------- */
  .achv-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:12px; margin-bottom:8px;
  }
  .achv-tile{
    display:flex; flex-direction:column; gap:4px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:10px;
    padding:14px; min-height:96px;
  }
  .achv-tile.unlocked{border-color:var(--amber); background:var(--amber-soft);}
  .achv-tile.locked{opacity:0.55;}
  .achv-icon{font-size:19px;}
  .achv-title{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:16px;}
  .achv-desc{font-size:12px; color:var(--text-dim); line-height:1.35;}
  .achv-reward{font-size:12px; color:var(--amber); font-family:'JetBrains Mono', monospace;}
  .toast-gain{margin-left:8px; color:var(--amber); font-family:'JetBrains Mono', monospace;}
  .achv-date{font-size:11px; color:var(--amber); font-family:'JetBrains Mono', monospace; margin-top:auto;}

  /* ---------- Champ invalide ---------- */
  .cash-form input.invalid{border-color:var(--bad); animation:shake .18s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}

  /* ---------- Récap : lignes correcte / incorrecte ---------- */
  tr.correct-row td{background:var(--ok-soft);}
  tr.wrong-row td{background:var(--bad-soft);}

  /* ---------- Réglages : bonus de rapidité ---------- */
  .speed-block{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-top:14px;}
  .speed-block h3{margin:0 0 10px; font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:17px; color:var(--text);}
  .speed-fields{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .speed-fields label{font-size:11px; color:var(--text-dim); display:block; text-transform:uppercase; letter-spacing:0.03em;}
  .speed-fields input{
    width:100%; margin-top:5px; font-family:'JetBrains Mono', monospace;
    background:var(--panel-light); border:1px solid var(--line); border-radius:6px;
    color:var(--text); padding:8px; font-size:14px;
  }
  .speed-fields input:focus{outline:none; border-color:var(--amber);}

  /* ---------- Cheatsheet ---------- */
  .cheat-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:8px;
  }
  .cheat-item{
    display:flex; align-items:center; gap:10px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px;
  }
  .cheat-item .cheat-name-wrap{display:flex; flex-direction:column; line-height:1.3;}
  .cheat-item .cheat-name{font-size:14px; font-weight:600;}
  .cheat-item .cheat-cheflieu{font-size:13px; color:var(--amber);}
  .cheat-item .cheat-region{font-size:11px; color:var(--text-dim);}
  .cheat-search{
    width:100%; font-family:'Source Sans 3', sans-serif; font-size:15px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:10px 14px; margin-bottom:18px;
  }
  .cheat-search:focus{outline:none; border-color:var(--amber);}

  /* ---------- Vies (cœurs) ---------- */
  .hearts{display:flex; gap:6px; justify-content:center; font-size:24px; margin-bottom:16px; line-height:1;}
  .heart{display:inline-block;}
  .heart.breaking{animation:heartBreak .5s ease forwards;}
  @keyframes heartBreak{
    0%{transform:scale(1) rotate(0); opacity:1;}
    30%{transform:scale(1.3) rotate(-10deg); opacity:1;}
    60%{transform:scale(0.8) rotate(10deg); opacity:0.55;}
    100%{transform:scale(0.9) rotate(0); opacity:0.5;}
  }

  /* ---------- Confettis (passage de niveau) ---------- */
  .confetti-piece{
    position:fixed; top:-14px; width:8px; height:14px; opacity:0.9;
    z-index:1100; pointer-events:none; border-radius:2px;
    animation-name:confettiFall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(720deg); opacity:0; }
  }
  .hardcore-warning{
    text-align:center; font-size:12px; color:#e2897d; text-transform:uppercase;
    letter-spacing:0.05em; margin-bottom:16px; font-family:'Barlow Condensed', sans-serif;
  }
  .exam-subtitle{
    text-align:center; font-size:13px; color:var(--text-dim);
    margin-bottom:16px; font-family:'Barlow Condensed', sans-serif; letter-spacing:0.02em;
  }

  /* ---------- Thème Hardcore ---------- */
  .card.theme-hardcore{
    --panel:#20100f; --panel-light:#331414; --line:#4a1a1a; --amber:#d1483f; --amber-soft:rgba(209,72,63,0.16);
    background:var(--panel); border-color:var(--line);
  }
  .card.theme-hardcore .plate-badge{background:#3a1414; border-color:#5c1f1f; color:#ffd9d4;}
  .card.theme-hardcore .keypad-key.keypad-special-ab{background:#5c2a2a; border-color:#8a4040; color:#ffe4e0;}
  .card.theme-hardcore .choice-btn, .card.theme-hardcore .mode-btn{background:var(--panel-light); border-color:var(--line);}
  .card.theme-hardcore .choice-btn:hover, .card.theme-hardcore .mode-btn:hover{border-color:var(--amber);}
  .card.theme-hardcore .cash-form input{background:var(--panel-light); border-color:var(--line);}
  .card.theme-hardcore .cash-form input:focus{border-color:var(--amber);}
  .mode-btn.hardcore-card{border-color:#4a1a1a;}
  .mode-btn.hardcore-card:hover{border-color:#d1483f; background:#2a1313;}
  .mode-btn.hardcore-card .m-title{color:#e2897d;}

  /* ---------- Mode Chaos : identité "fun/chaotique" ---------- */
  @keyframes chaosSpin{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .stats-subtab.chaos-subtab{
    font-weight:700; border-width:2px; border-color:#ff3ec8; color:#ff8fe0;
  }
  .stats-subtab.chaos-subtab:hover{border-color:#00d9ff; color:#7fe8ff;}
  .stats-subtab.chaos-subtab.active{
    border-color:#ff3ec8; color:#ff3ec8;
    background:linear-gradient(90deg, rgba(255,62,200,0.16), rgba(0,217,255,0.16), rgba(232,89,12,0.16));
  }
  button.primary.chaos-btn{
    background:linear-gradient(90deg, #ff3ec8, #00d9ff, #e8590c, #00e68a, #ff3ec8);
    background-size:200% 100%;
    animation:chaosSpin 5s linear infinite;
    color:#0a0e1f; border:none;
  }
  button.primary.chaos-btn:hover{filter:brightness(1.08);}
  .chaos-question-tag{
    text-align:center; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--amber); font-family:'Barlow Condensed', sans-serif; margin-bottom:6px;
  }
  .card-chaos{position:relative;}
  .card-chaos::before{
    content:""; position:absolute; inset:0; border-radius:var(--radius);
    padding:2px; pointer-events:none;
    background:linear-gradient(120deg, #ff3ec8, #00d9ff, #e8590c, #00e68a, #ff3ec8);
    background-size:200% 200%;
    animation:chaosSpin 8s linear infinite;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0.55;
  }

  /* ---------- Podium (streaks Infini) ---------- */
  .podium-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .podium-row{
    display:flex; align-items:center; gap:12px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px;
  }
  .podium-medal{font-size:20px;}
  .podium-streak{font-family:'JetBrains Mono', monospace; font-weight:700; flex:1;}
  .podium-time{font-family:'JetBrains Mono', monospace; font-size:13px;}

  /* ---------- Mode Examen ---------- */
  .exam-list{display:flex; flex-direction:column; gap:10px;}
  .exam-row{
    display:grid; grid-template-columns:1fr auto; grid-template-areas:"main btn" "bar bar";
    align-items:center; gap:10px 14px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px;
  }
  .exam-row-main{grid-area:main; display:flex; flex-direction:column; gap:3px;}
  .exam-row-name{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:17px;}
  .exam-row-score{font-size:12px;}
  .exam-progress-track{grid-area:bar; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .exam-progress-fill{height:100%; background:var(--amber); transition:width .3s;}
  .exam-row-btn{grid-area:btn;}
  .exam-row-locked{opacity:0.55;}
  .exam-row-locked .exam-row-name{font-size:15px;}
  .exam-row-final{border-color:var(--amber);}

  /* ---------- Sélecteur de longueur (mode classique) ---------- */
  .length-picker{display:flex; gap:8px; margin-bottom:14px;}
  .length-btn{
    flex:1; font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700;
    background:var(--panel-light); border:1px solid var(--line); border-radius:8px;
    color:var(--text-dim); padding:10px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .length-btn:hover{border-color:var(--amber);}
  .length-btn.active{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}

  /* ---------- Toggle "mode inversé" ---------- */
  .reverse-row{
    display:flex; align-items:center; justify-content:flex-end; gap:9px;
    margin-bottom:16px;
  }
  .reverse-label{font-size:12.5px; text-align:right; line-height:1.3;}
  .reverse-switch{
    position:relative; flex-shrink:0; width:42px; height:23px; padding:0;
    border-radius:12px; background:var(--panel-light); border:1px solid var(--line);
    cursor:pointer; transition:background .2s, border-color .2s;
  }
  .reverse-switch.active{background:var(--amber-soft); border-color:var(--amber);}
  .reverse-knob{
    position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%;
    background:var(--text-dim); transition:transform .2s, background .2s;
  }
  .reverse-switch.active .reverse-knob{transform:translateX(19px); background:var(--amber);}

  /* ---------- Barre XP / niveau ---------- */
  .xp-bar-wrap{margin-bottom:20px;}
  .xp-bar-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .xp-level{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:16px;
    color:var(--amber); letter-spacing:0.02em;
  }
  .xp-count{font-family:'JetBrains Mono', monospace; font-size:12px;}
  .xp-track{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .xp-fill{height:100%; background:linear-gradient(90deg, var(--amber), var(--ok)); transition:width .4s;}

  /* ---------- Grille de palettes ---------- */
  .theme-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px; margin-bottom:8px;
  }
  .theme-card{
    display:flex; flex-direction:column; gap:8px; align-items:flex-start; text-align:left;
    background:var(--panel-light); border:1px solid var(--line); border-radius:10px;
    padding:12px; cursor:pointer; font-family:'Source Sans 3', sans-serif;
    transition:border-color .15s;
  }
  .theme-card:hover:not(.locked){border-color:var(--amber);}
  .theme-card.active{border-color:var(--amber); background:var(--amber-soft);}
  .theme-card.locked{cursor:pointer;}
  .theme-swatch-locked{align-items:center; justify-content:center; min-height:18px;}
  .theme-swatch{display:flex; gap:4px;}
  .theme-swatch span{width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,0.15); display:inline-block;}
  .theme-name{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:15px; color:var(--text);}
  .theme-unlock{font-size:11px;}

  /* ---------- Chefs-lieux : choix textuels et recherche façon cheatsheet ---------- */
  .choice-btn-text{
    padding:15px 18px;
    min-height:52px;
    justify-content:flex-start;
  }
  .choice-city{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:17px;
    line-height:1.3;
    text-align:left;
    color:var(--text);
    word-break:break-word;
  }
  .cheflieu-search-list{
    display:flex; flex-direction:column; gap:6px; margin-top:12px; max-height:340px; overflow-y:auto;
  }
  .cheflieu-item{cursor:pointer; transition:border-color .15s;}
  .cheflieu-item:hover{border-color:var(--amber);}

  /* ---------- Sous-onglets Statistiques ---------- */
  .stats-subtabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px;}
  .stats-subtab{
    font-family:'Barlow Condensed', sans-serif; font-size:14px; letter-spacing:0.02em;
    background:var(--panel-light); border:1px solid var(--line); border-radius:20px;
    color:var(--text-dim); padding:7px 14px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .stats-subtab:hover{border-color:var(--amber); color:var(--text);}
  .stats-subtab.active{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}

  .stats-level-parent{margin-bottom:12px;}
  .stats-level-child{margin-bottom:12px;}
  .stats-level-child .stats-subtab{font-size:13px; padding:5px 12px;}
  .stats-level-length .stats-subtab{font-size:12px; padding:4px 10px; border-radius:6px;}
  .stats-level-parent .stats-subtab{font-size:16px;}

  /* ---------- Brossards & Pass Navi'go ---------- */
  .brossard-sym{font-style:normal; font-weight:700;}
  .brossard-amount{white-space:nowrap; font-family:'JetBrains Mono', monospace; font-weight:600;}
  .brossard-pill{
    margin-left:10px; padding:2px 10px; border-radius:12px; font-size:13px;
    border:1px solid var(--amber); color:var(--amber); background:var(--amber-soft);
    vertical-align:middle;
  }
  .pass-balance{
    text-align:center; padding:22px 10px; margin-bottom:20px;
    background:var(--panel-light); border:1px solid var(--line); border-radius:12px;
  }
  .pass-balance-value{
    font-family:'JetBrains Mono', monospace; font-size:44px; font-weight:700;
    color:var(--amber); margin:4px 0; padding-top:6px;
  }
  .pass-balance-sub{font-size:13px; letter-spacing:.08em; text-transform:uppercase;}
  .pass-pulls{display:flex; flex-direction:column; gap:10px;}
  .pass-pull-btn{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 16px; border-radius:10px; cursor:pointer;
    background:var(--panel-light); border:1px solid var(--amber); color:var(--text);
    font-family:'Barlow Condensed', sans-serif; font-size:18px; letter-spacing:.03em;
  }
  .pass-pull-btn:hover:not(:disabled){background:var(--amber-soft);}
  .pass-pull-btn:disabled{opacity:.45; cursor:not-allowed; border-color:var(--line);}
  .pass-pull-cost{font-size:15px; color:var(--amber);}
  .pass-soon{
    margin-top:16px; padding:12px 14px; border-radius:8px; font-size:14px;
    background:var(--amber-soft); border:1px dashed var(--amber); color:var(--text);
  }

  /* ---------- Pass Navi'go : packs, collection ---------- */
  .pass-sandbox{
    margin:0 0 16px; padding:10px 12px; border-radius:8px; font-size:13px;
    border:1px dashed var(--ok); background:var(--ok-soft);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .pass-sandbox > span{flex:1 1 100%;}
  .sb-btn{
    padding:5px 11px; border-radius:6px; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel-light); color:var(--text);
  }
  .sb-btn:hover{border-color:var(--amber); color:var(--amber);}
  .pass-sb-start{
    margin-top:12px; width:100%; padding:11px; border-radius:8px; cursor:pointer; font-size:15px;
    border:1px solid var(--ok); background:var(--ok-soft); color:var(--text);
  }
  .pass-sb-link{
    display:block; margin:6px auto 0; padding:6px; background:none; border:none; cursor:pointer;
    color:var(--text-dim); font-size:13px; text-decoration:underline;
  }
  .pass-qty-row{display:flex; gap:8px; margin:0 0 14px;}
  .pass-qty{
    padding:6px 16px; border-radius:16px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel-light); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:14px;
  }
  .pass-qty.active{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}
  .pass-pack{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px; margin-bottom:10px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel-light);
  }
  .pass-pack.forge{border-color:var(--amber);}
  .pass-pack-info{min-width:0;}
  .pass-pack-name{font-family:'Barlow Condensed', sans-serif; font-size:19px; letter-spacing:.03em;}
  .pass-pack-desc{font-size:13px;}
  .pass-buy{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px;
    border:1px solid var(--amber); background:transparent; color:var(--text);
  }
  .pass-buy:hover:not(:disabled){background:var(--amber-soft);}
  .pass-buy:disabled{opacity:.45; cursor:not-allowed; border-color:var(--line);}
  .pass-buy-cost{color:var(--amber); font-size:13px;}
  .pass-prog-row{display:flex; align-items:center; gap:10px; margin:9px 0; font-size:14px;}
  .pass-prog-label{flex:0 0 104px;}
  .pass-prog-bar{flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; display:block;}
  .pass-prog-fill{display:block; height:100%; background:var(--amber);}
  .pass-prog-count{flex:0 0 66px; text-align:right; font-family:'JetBrains Mono', monospace; font-size:13px;}
  .pass-complete{margin:6px 0; color:var(--amber); font-weight:600;}
  .pass-dupes{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:14px;
  }
  .pass-sell{
    padding:7px 16px; border-radius:8px; cursor:pointer;
    border:1px solid var(--amber); background:transparent; color:var(--amber); font-size:14px;
  }
  .pass-sell:hover:not(:disabled){background:var(--amber-soft);}
  .pass-sell:disabled{opacity:.4; cursor:not-allowed; border-color:var(--line); color:var(--text-dim);}
  .pass-chips{display:flex; flex-wrap:wrap; margin:-3px;}
  .pass-chip{
    display:inline-block; padding:4px 9px; margin:3px; border-radius:6px; font-size:13px;
    border:1px solid var(--line); background:var(--panel-light);
  }
  .pass-chip b{font-family:'JetBrains Mono', monospace; color:var(--amber);}
  .pass-chip.chef{border-color:var(--ok);}
  .pass-chip.region{border-color:var(--plate-blue);}
  .pass-chip.rare{border-color:#ffd66e;}
  .pass-chip.dupe{opacity:.5;}
  .pass-chip.new{box-shadow:0 0 0 1px var(--amber);}
  .pass-chip i{font-style:normal; font-size:10px; color:var(--amber); margin-left:5px; letter-spacing:.06em;}
  .pass-filter{
    margin:12px 0 0; padding:5px 12px; border-radius:14px; cursor:pointer; font-size:13px;
    border:1px solid var(--line); background:var(--panel-light); color:var(--text);
  }
  .pass-filter.active{border-color:var(--amber); color:var(--amber);}
  .pass-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-top:12px;}
  .pass-tile{
    display:flex; align-items:center; gap:8px; padding:8px 10px; min-height:44px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel-light);
  }
  .pass-tile.chef.owned{border-color:var(--ok);}
  .pass-tile.region{flex-direction:column; align-items:flex-start; gap:2px;}
  .pass-tile.rare{grid-column:1 / -1; align-items:center;}
  .pass-tile.rare.owned{border-color:#ffd66e; background:linear-gradient(120deg, rgba(255,214,102,.14), var(--panel-light));}
  .rare-ic{font-size:22px; line-height:1; flex:0 0 auto; width:28px; text-align:center; color:#ffd66e;}
  .pass-prog-row.rare .pass-prog-fill{background:#ffd66e;}
  .pass-tile.locked{opacity:.4;}
  .pass-tile.pickable{opacity:.9; cursor:pointer; border-style:dashed; border-color:var(--amber);}
  .pass-tile.selected{background:var(--amber-soft); opacity:1;}
  .pass-tile-wrap{display:flex; flex-direction:column; min-width:0;}
  .pass-tile-name{font-size:14px; font-weight:600;}
  .pass-tile-sub{font-size:12px; color:var(--text-dim);}
  .pass-forge-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; padding:10px 12px;
    border:1px dashed var(--amber); border-radius:8px; background:var(--amber-soft); font-size:14px;
  }
  .pass-forge-bar > span{flex:1 1 100%;}

  /* ---------- Cartes de la collection ---------- */
  .pass-view-row{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px;}
  .pass-pill{
    padding:6px 14px; border-radius:16px; cursor:pointer; font-size:14px;
    border:1px solid var(--line); background:var(--panel-light); color:var(--text);
  }
  .pass-pill.active{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}
  .pass-map-wrap{
    margin-top:12px; overflow:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--line); border-radius:10px; background:var(--ink);
  }
  .pass-map{display:block; width:100%; height:auto;}
  .pass-map-wrap.zoomed .pass-map{width:240%; max-width:none;}
  .pm-shape{stroke:var(--ink); stroke-width:1px; vector-effect:non-scaling-stroke; cursor:pointer;}
  .pm-shape.locked{stroke:var(--line);}
  .pm-shape.pickable{stroke:var(--amber); stroke-dasharray:4 3;}
  .pm-shape.sel{stroke:var(--amber); stroke-width:2.5px; stroke-dasharray:none;}
  .pm-frame{fill:none; stroke:var(--line); stroke-width:1px; vector-effect:non-scaling-stroke;}
  .pm-label{fill:var(--text-dim); font-size:230px; font-family:'JetBrains Mono', monospace;}
  .pm-dots{pointer-events:none;}
  .pm-dot{fill:var(--text-dim); fill-opacity:.55;}
  .pm-dot.owned{fill:var(--ok); fill-opacity:1; stroke:var(--text); stroke-width:1px; vector-effect:non-scaling-stroke;}
  .pass-map-info{
    margin-top:10px; padding:10px 12px; min-height:44px; font-size:14px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel-light);
  }
  .pass-map-info .pass-forge-bar{margin:-1px; border-radius:8px;}
  .pm-tag{
    display:inline-block; padding:1px 8px; margin-right:4px; border-radius:10px; font-size:11px;
    letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--text-dim);
  }

  /* ---------- Verrous, aide, déblocages ---------- */
  .lock-ic{color:#8a93a6; margin-left:6px; vertical-align:-2px; flex:none;}
  nav.tabs button .lock-ic{margin-left:5px;}
  nav.tabs button{white-space:nowrap;}
  .help-fab{
    position:fixed; top:calc(max(16px, env(safe-area-inset-top, 0px)) + 52px);
    right:max(16px, env(safe-area-inset-right, 0px)); z-index:500;
    width:42px; height:42px; border-radius:50%; cursor:pointer;
    background:#2f7bff; border:1px solid #6aa0ff; color:#fff;
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:23px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.3); transition:transform .15s, background .15s;
  }
  .help-fab:hover{background:#4a8dff; transform:scale(1.07);}
  .modal-box.modal-wide{max-width:760px; max-height:86vh; display:flex; flex-direction:column; padding:0; overflow:hidden;}
  .help-head{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--line);}
  .help-close{padding:4px 12px; font-size:16px;}
  .help-body{overflow-y:auto; padding:4px 22px 24px; -webkit-overflow-scrolling:touch;}
  .help-body::after{content:""; display:block; height:55vh;}
  .help-sec{padding-top:18px; margin-top:6px; border-top:1px solid var(--line);}
  .help-sec:first-child{border-top:none; margin-top:0;}
  .help-sec h2{font-family:'Barlow Condensed', sans-serif; font-size:20px; margin:0 0 8px; letter-spacing:.03em;}
  .help-sec p, .help-sec li{font-size:15px; line-height:1.5;}
  .help-sec ul{margin:6px 0 10px; padding-left:20px;}
  .help-sec.is-locked h2{color:var(--text-dim);}
  .help-locked{display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:14px; padding:10px 12px; border:1px dashed var(--line); border-radius:8px;}
  .help-locked .lock-ic{margin:0;}
  .help-sec.flash{animation:helpFlash 1.4s ease-out;}
  @keyframes helpFlash{from{background:var(--amber-soft);} to{background:transparent;}}
  .modal-box.modal-rules{max-width:520px; max-height:88vh; display:flex; flex-direction:column;}
  .first-rules{overflow-y:auto; flex:1 1 auto; min-height:0; -webkit-overflow-scrolling:touch;}
  .first-rules p, .first-rules li{font-size:15px; line-height:1.5;}
  .first-rules ul{margin:6px 0 10px; padding-left:20px;}
  .onboarding-err{color:var(--bad); font-size:14px; margin:-6px 0 12px;}
  .lock-popup, .unlock-popup{text-align:center;}
  .lock-popup-ic{display:flex; justify-content:center; margin-bottom:8px;}
  .lock-popup-ic .lock-ic{margin:0;}
  .lock-popup-cond{font-size:16px; line-height:1.45;}
  .lock-link{color:var(--amber); text-decoration:underline; cursor:pointer; font-size:15px;}
  .unlock-list{text-align:left; margin-top:14px;}
  .unlock-item{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line);}
  .unlock-item:first-child{border-top:none;}
  .unlock-ic{font-size:26px; line-height:1.1;}
  .unlock-swatch{display:flex; gap:4px; margin-top:6px;}
  .unlock-swatch span{width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,0.2);}

  /* ---------- Ouverture de booster ---------- */
  .rv-overlay{
    position:fixed; inset:0; z-index:950; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:radial-gradient(ellipse at 50% 18%, #1d2a44 0%, #0b1220 62%, #05080f 100%);
    display:flex; justify-content:center;
    padding:max(14px, env(safe-area-inset-top, 0px)) 14px max(14px, env(safe-area-inset-bottom, 0px));
  }
  .rv-stage{width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; position:relative;}
  .rv-head{font-family:'Barlow Condensed', sans-serif; font-size:24px; letter-spacing:.06em; color:var(--text); margin:6px 0 4px; text-transform:uppercase;}
  .rv-booster-zone{height:226px; display:flex; align-items:center; justify-content:center; width:100%; position:relative;}
  .rv-booster{position:relative; width:128px; height:184px; transform-origin:50% 92%; opacity:0; filter:drop-shadow(0 12px 16px rgba(0,0,0,.5));}
  .rv-booster.enter{animation:rvEnter .45s cubic-bezier(.2,.9,.3,1.2) forwards;}
  .rv-booster.shaking{opacity:1; animation:rvShake 1.1s linear;}
  .rv-booster.opening{opacity:1;}
  .rv-booster.opened{opacity:.28; transform:scale(.86); transition:opacity .5s, transform .5s;}
  .rv-b-body{
    position:absolute; inset:0; border-radius:11px; color:#fff;
    background:linear-gradient(158deg, hsl(var(--h) 85% 64%), hsl(var(--h) 72% 40%) 58%, hsl(calc(var(--h) + 28) 70% 27%));
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.28), inset 0 -26px 40px rgba(0,0,0,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; overflow:hidden;
    /* le haut du booster est une découpe irrégulière : c'est la partie qui reste une fois la bande arrachée */
    clip-path:polygon(0.0% 34px,8.33% 26px,16.67% 32px,25.0% 24px,33.33% 35px,41.67% 27px,50.0% 33px,58.33% 25px,66.67% 34px,75.0% 28px,83.33% 32px,91.67% 26px,100.0% 35px,100% 100%,0 100%);
  }
  /* lumière qui s'échappe du booster déchiré */
  .rv-b-body::before{
    content:""; position:absolute; left:0; right:0; top:0; height:58px; z-index:0; opacity:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,246,212,.95), rgba(255,246,212,0));
  }
  .rv-booster.opening .rv-b-body::before, .rv-booster.quick .rv-b-body::before{animation:rvInner .95s ease-out forwards;}
  .rv-b-beam{
    position:absolute; left:4%; right:4%; bottom:calc(100% - 31px); height:150px; z-index:0; opacity:0;
    transform-origin:50% 100%; pointer-events:none; filter:blur(3px);
    background:linear-gradient(to top, rgba(255,247,215,.95), rgba(255,226,150,.55) 38%, rgba(255,226,150,0));
  }
  .rv-booster.opening .rv-b-beam{animation:rvBeam 1.1s .08s ease-out forwards;}
  .rv-booster.quick .rv-b-beam{animation:rvBeam .55s ease-out forwards;}
  .rv-b-body::after{
    content:""; position:absolute; top:-30%; left:-60%; width:60%; height:160%; transform:rotate(18deg);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    animation:rvShine 2.2s ease-in-out infinite;
  }
  .rv-b-logo{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:25px; line-height:1; text-align:center; letter-spacing:.05em; text-shadow:0 2px 6px rgba(0,0,0,.4);}
  .rv-b-sym{font-size:34px; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.45);}
  .rv-b-top{

    background:linear-gradient(180deg, hsl(var(--h) 80% 72%), hsl(var(--h) 70% 46%));
    clip-path:polygon(0 0,100% 0,100.0% 36px,91.67% 27px,83.33% 33px,75.0% 29px,66.67% 35px,58.33% 26px,50.0% 34px,41.67% 28px,33.33% 36px,25.0% 25px,16.67% 33px,8.33% 27px,0.0% 35px);

    transform-origin:100% 100%;     /* la bande se décolle depuis la gauche et part en arrachant */

  .rv-booster.opening .rv-b-top{animation:rvTear .68s ease-in forwards;}
  .rv-b-glow{position:absolute; left:50%; top:6%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; opacity:0;
    background:radial-gradient(circle, #fff 0%, hsl(var(--h) 100% 78%) 38%, transparent 70%); pointer-events:none; z-index:3;}
  .rv-booster.opening .rv-b-glow{animation:rvBurst .85s ease-out forwards;}
  .rv-booster.multi::before, .rv-booster.multi::after{
    content:""; position:absolute; inset:0; border-radius:11px; z-index:-1;
    background:linear-gradient(158deg, hsl(var(--h) 70% 50%), hsl(var(--h) 65% 28%)); box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
  }
  .rv-booster.multi::before{transform:translate(9px,-7px) rotate(4deg);}
  .rv-booster.multi::after{transform:translate(-9px,-4px) rotate(-4deg);}
  .rv-b-qty{position:absolute; right:-14px; bottom:-10px; z-index:4; padding:3px 11px; border-radius:14px; font-family:'JetBrains Mono', monospace; font-size:17px; font-weight:700;
    color:#1a1205; background:var(--amber); box-shadow:0 4px 10px rgba(0,0,0,.4);}
  .rv-sec{align-self:flex-start; margin:10px 0 4px 4px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim);}

  .rv-slot.t-rare{display:none;}

  .rv-slot.t-rare .rv-pile{border-color:rgba(255,214,102,.7);}

  .rv-slot.t-rare .rv-count{background:#ffd66e; color:#2a1c00;}
  .rv-slot{display:flex; flex-direction:column; align-items:center; position:relative;}
  .rv-pile{
    position:relative; width:100%; max-width:112px; aspect-ratio:1/1; border-radius:12px;

  .rv-card{
    position:absolute; width:62%; height:62%; padding:6px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, #26334f, #141c30); box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .rv-card.dupe{background:linear-gradient(160deg, #2a2f3a, #181b24);}
  .rv-card.pop{animation:rvPop .38s cubic-bezier(.2,.9,.3,1.4);}
  .rv-face{width:100%; height:100%; display:block;}
  .rv-win rect{fill:#1b2540;}
  .rv-fly{position:fixed; width:56px; height:56px; z-index:3; pointer-events:none; filter:drop-shadow(0 0 8px rgba(255,255,255,.6)); will-change:transform;}
  .rv-count{
    position:absolute; top:-8px; right:2px; min-width:26px; padding:2px 8px; border-radius:13px; text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:700; color:#10151f; background:var(--amber);
    opacity:0; transform:scale(.6); transition:opacity .2s, transform .2s; z-index:2; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .rv-slot.t-region .rv-count{background:#6aa0ff;} .rv-slot.t-chef .rv-count{background:#4c9a6a; color:#fff;}
  .rv-count.on{opacity:1; transform:scale(1);}
  .rv-count.bump{animation:rvBump .3s ease-out;}
  .rv-slot-label{margin-top:5px; font-size:12px; color:var(--text-dim);}
  .rv-sum{min-height:22px; margin-top:12px; font-size:15px; color:var(--text);}
  .rv-actions{margin-top:8px; width:100%; display:flex; justify-content:center; padding-bottom:6px;}
  .rv-actions .primary{min-width:200px;}
  .rv-forge-zone{position:relative; width:100%; height:300px; display:flex; align-items:center; justify-content:center;}
  .rv-forge-flash{position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; opacity:0;
    background:radial-gradient(circle, #fff 0%, rgba(255,214,120,.8) 35%, transparent 70%);}
  .rv-forge-flash.go{animation:rvForgeFlash 1s ease-out forwards;}
  .rv-forge-card{width:190px; height:190px; padding:18px; border-radius:18px; opacity:0; transform:scale(.3) rotate(-14deg);
    background:linear-gradient(160deg, #26334f, #141c30); box-shadow:0 10px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.2); z-index:2;}
  .rv-forge-card.show{animation:rvForgeIn .8s .35s cubic-bezier(.2,.9,.3,1.25) forwards;}
  @keyframes rvEnter{from{opacity:0; transform:translateY(-70px) scale(.7) rotate(-8deg);} to{opacity:1; transform:none;}}
  @keyframes rvShake{
    0%,100%{transform:translate(0,0) rotate(0);}
    8%{transform:translate(-3px,0) rotate(-3deg);}  16%{transform:translate(3px,0) rotate(3deg);}
    24%{transform:translate(-5px,0) rotate(-5deg);} 32%{transform:translate(5px,0) rotate(5deg);}
    40%{transform:translate(-7px,0) rotate(-7deg);} 48%{transform:translate(7px,0) rotate(7deg);}
    56%{transform:translate(-9px,0) rotate(-9deg);} 64%{transform:translate(9px,0) rotate(9deg);}
    72%{transform:translate(-11px,0) rotate(-10deg);} 80%{transform:translate(11px,0) rotate(10deg);}
    90%{transform:translate(-5px,0) rotate(-4deg);}
  }
  @keyframes rvShine{0%{left:-60%;} 60%,100%{left:130%;}}
  @keyframes rvTear{
    0%{transform:none; opacity:1;}
    16%{transform:rotate(-3deg) translateY(-1px); opacity:1;}
    42%{transform:rotate(-15deg) translate(3px,-9px); opacity:1;}

  @keyframes rvBeam{0%{opacity:0; transform:scaleY(.15);} 25%{opacity:1; transform:scaleY(1);} 100%{opacity:0; transform:scaleY(1.15);}}

  @keyframes rvPop{from{transform:scale(.3);} 60%{transform:scale(1.18);} to{transform:scale(1);}}
  @keyframes rvBump{0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);}}
  @keyframes rvForgeFlash{0%{opacity:0; transform:scale(.3);} 25%{opacity:1;} 100%{opacity:0; transform:scale(14);}}
  @keyframes rvForgeIn{from{opacity:0; transform:scale(.3) rotate(-14deg);} to{opacity:1; transform:scale(1) rotate(0);}}
  @media (prefers-reduced-motion: reduce){
    .rv-booster, .rv-card, .rv-count{animation:none !important; transition:none !important;}
  }

  .rv-packctr{font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--amber); margin:-2px 0 2px; letter-spacing:.06em;}
  .rv-booster.quick{opacity:1; animation:rvQuick .3s ease-out;}
  .rv-booster.quick .rv-b-glow{animation:rvBurst .45s ease-out forwards;}

  .rv-spot{position:absolute; left:0; right:0; top:0; bottom:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 42%, rgba(5,8,15,.35), rgba(5,8,15,.82)); pointer-events:none; animation:rvSpotBg .22s ease-out;}
  .rv-spot-card{width:176px; height:176px; padding:18px; border-radius:20px; background:linear-gradient(160deg,#2c3c5f,#141c30);
    box-shadow:0 0 0 2px rgba(106,160,255,.65), 0 0 46px rgba(106,160,255,.65), 0 14px 34px rgba(0,0,0,.6); animation:rvSpotIn .28s cubic-bezier(.2,.9,.3,1.3);}
  .rv-spot.rare{overflow:hidden;}
  .rv-spot.rare::before{
    content:""; position:absolute; left:50%; top:50%; width:460px; height:460px; margin:-250px 0 0 -230px; border-radius:50%;
    background:repeating-conic-gradient(rgba(255,214,102,.26) 0 7deg, transparent 7deg 20deg);

    animation:rvRays 7s linear infinite;
  }
  .rv-spot.rare.leaving::before{opacity:0; transition:opacity .15s;}
  .rv-spot.rare .rv-spot-card{position:relative; background:linear-gradient(160deg,#5a4616,#1e1708);
    box-shadow:0 0 0 2px rgba(255,214,102,.85), 0 0 60px rgba(255,200,80,.8), 0 14px 34px rgba(0,0,0,.6);}
  .rv-spot.rare .rv-spot-label{position:relative; color:#ffd66e;}
  .rv-spot-name{position:relative; margin-top:4px; font-size:17px; color:#fff3cf; transition:opacity .15s;}
  @keyframes rvRays{to{transform:rotate(360deg);}}
  .rv-spot-label{margin-top:14px; font-family:'Barlow Condensed', sans-serif; font-size:21px; letter-spacing:.14em; text-transform:uppercase; color:#9cc0ff; transition:opacity .15s;}
  @keyframes rvQuick{0%{transform:scale(.88) rotate(-3deg);} 50%{transform:scale(1.1) rotate(2deg);} 100%{transform:scale(1) rotate(0);}}
  @keyframes rvFlap{0%{transform:translateY(0);} 40%{transform:translateY(-14px) rotate(-6deg);} 100%{transform:none;}}
  @keyframes rvSpotIn{from{opacity:0; transform:scale(.3) rotate(-10deg);} to{opacity:1; transform:scale(1) rotate(0);}}
  @keyframes rvSpotBg{from{opacity:0;} to{opacity:1;}}

  /* ---------- Journal du dernier tirage (compact, pliable) ---------- */
  .card.pass-log{padding:0; overflow:hidden;}

  .gear-btn{

  .recap-sticky{
    position:sticky; top:0; z-index:30;
    background:var(--panel);
    margin:-26px -26px 18px;
    padding:22px 26px 16px;
    border-bottom:1px solid var(--line);
    border-radius:var(--radius) var(--radius) 0 0;
  }

  /* ---------- Responsive mobile ---------- */
  @media (max-width: 480px){
    body{padding:14px 10px 46px;}

    .cash-form input{width:100%;}
    table{font-size:12px;}
    th,td{padding:6px 4px;}

    .gear-btn{top:10px; right:10px; width:36px; height:36px; font-size:17px;}
    .help-fab{top:54px; right:10px; width:36px; height:36px; font-size:20px;}

    .help-head{padding:14px 16px;} .help-body{padding:4px 16px 20px;}
    .recap-sticky{margin:-18px -16px 16px; padding:16px 16px 12px;}
    .exam-row{grid-template-columns:1fr; grid-template-areas:"main" "bar" "btn";}
    .exam-row-btn{width:100%;}
  }
</style>
</head>

function cloneConfig(o){ return JSON.parse(JSON.stringify(o)); }

function deepMergeConfig(base, override){
  const out = cloneConfig(base);
  for(const k in override){
    const v = override[k];
    if(v && typeof v === "object" && !Array.isArray(v) && out[k] && typeof out[k] === "object"){
      out[k] = deepMergeConfig(out[k], v);
    } else {
      out[k] = v;
    }
  }
  return out;
}

function loadConfig(){
  try{
    const raw = localStorage.getItem(LS_CONFIG);
    if(!raw) return cloneConfig(DEFAULT_CONFIG);
    return deepMergeConfig(DEFAULT_CONFIG, JSON.parse(raw));
  }catch(e){ return cloneConfig(DEFAULT_CONFIG); }
}
function saveConfig(cfg){
  localStorage.setItem(LS_CONFIG, JSON.stringify(cfg));
}

function unlockedBackgrounds(){

// ---- pavage du plan : la forme du département est recopiée toujours dans le même sens, en réseau serré ----
const BG_SIZE = 78;   // plus grande dimension d'une tuile, en px
const BG_TONES = ["var(--panel-light)", "var(--line)", "var(--plate-blue)"];

// <defs> + tuiles <use> couvrant un rectangle w × h ; les couleurs viennent des variables de la palette
function backgroundTilesHtml(code, w, h, size, tileId){
  const pk = MAP_PACK[code];
  const item = passCatalog().dept.find(d=>d.code === code);
  if(!pk || !item) return "";
  const [th, v1x, v1y, v2x, v2y, mrot, cx, cy] = pk;
  const sc = size / mrot;
  const a = v1x * sc, b = v1y * sc, c = v2x * sc, d = v2y * sc;          // V1 = (a,b), V2 = (c,d)
  const det = a * d - b * c;
  if(!isFinite(det) || Math.abs(det) < 1) return "";
  const m = size;                                                         // marge : une tuile
  let iMin = 1e9, iMax = -1e9, jMin = 1e9, jMax = -1e9;
  [[-m, -m], [w + m, -m], [-m, h + m], [w + m, h + m]].forEach(([x, y])=>{
    const i = (d * x - c * y) / det, j = (-b * x + a * y) / det;
    iMin = Math.min(iMin, i); iMax = Math.max(iMax, i); jMin = Math.min(jMin, j); jMax = Math.max(jMax, j);
  });
  iMin = Math.floor(iMin); iMax = Math.ceil(iMax); jMin = Math.floor(jMin); jMax = Math.ceil(jMax);
  // 3 teintes réparties de façon que deux tuiles voisines n'aient jamais la même
  const dot = v1x * v2x + v1y * v2y;
  const tone = (i, j)=>BG_TONES[(((dot < 0 ? i + j : i - j) % 3) + 3) % 3];
  const info = passShapeInfo(item);
  let uses = "", count = 0;
  for(let i = iMin; i <= iMax && count < 1500; i++){
    for(let j = jMin; j <= jMax && count < 1500; j++){
      const x = i * a + j * c, y = i * b + j * d;
      if(x < -m || x > w + m || y < -m || y > h + m) continue;
      uses += `<use href="#${tileId}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" style="fill:${tone(i, j)}"/>`;
      count++;
    }
  }
  return `<defs><path id="${tileId}" d="${info.d}" fill-rule="evenodd" transform="rotate(${th}) scale(${sc.toFixed(5)}) translate(${-cx} ${-cy})"/></defs>${uses}`;
}

function fillBackground(svg){
  svg.innerHTML = backgroundTilesHtml(svg.dataset.code, window.innerWidth, window.innerHeight, BG_SIZE, "bg-tile");
}

// pose (ou retire) le fond selon CONFIG.background ; le fond suit la palette (variables CSS)

  if(old) old.remove();
  let code = CONFIG.background;
  if(code && !isBackgroundUnlocked(code)){ CONFIG.background = ""; saveConfig(CONFIG); code = ""; }   // ex. collection réinitialisée

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.id = "bg-mosaic";

  svg.setAttribute("aria-hidden", "true");
  fillBackground(svg);
  document.body.insertBefore(svg, document.body.firstChild);
  document.documentElement.setAttribute("data-bg", "on");
}

/* =========================================================
   XP & NIVEAUX
   Score = XP, cumul de toutes les parties (tous modes confondus).
   Seuil cumulé pour atteindre le niveau L : 21 * (L-1)^2
   -> paliers faciles au début, de plus en plus exigeants ensuite.
   ========================================================= */
const XP_LEVEL_CONSTANT = 21;

function xpThresholdForLevel(level){
  if(level <= 1) return 0;
  return XP_LEVEL_CONSTANT * Math.pow(level - 1, 2);
}

function levelForXp(xp){
  let level = 1;
  while(xpThresholdForLevel(level + 1) <= xp){
    level++;
  }
  return level;
}

function computeTotalXp(){
  return loadSessions().reduce((sum, s) => sum + (s.score || 0), 0);
}

function getPlayerLevel(){
  return levelForXp(computeTotalXp());
}

function getXpProgress(){
  const xp = computeTotalXp();
  const level = levelForXp(xp);
  const floor = xpThresholdForLevel(level);
  const ceiling = xpThresholdForLevel(level + 1);
  const span = ceiling - floor;
  const into = xp - floor;
  const pct = span > 0 ? Math.round((into / span) * 100) : 100;
  return { xp, level, floor, ceiling, into, span, pct };
}

/* =========================================================
   PASS NAVI'GO & BROSSARDS (devise)
   - Le menu et la devise sont débloqués au niveau 10.
   - 1 Brossard gagné tous les 10 XP (cumul total, y compris avant le niveau 10).
   - Lancer unitaire : 10 Brossards (x1, x10, ou max possible).
   Portefeuille persistant : { earned, xpCredited, spent, refunded }
     earned     = Brossards gagnés depuis le début
     xpCredited = XP déjà converti en Brossards (multiple de 10)
     spent      = Brossards dépensés
     refunded   = Brossards récupérés (vente de doublons)
     rewarded   = Brossards reçus en récompense de succès
     solde      = earned + refunded + rewarded - spent
   -> réinitialiser les statistiques ne fait PAS perdre les Brossards.
   ========================================================= */
const PASS_UNLOCK_LEVEL = 10;
const BROSSARD_XP_RATE = 10;      // 1 B pour 10 XP
const PASS_ENABLED = true;        // achats ouverts ; le bac à sable (Brossards fictifs) reste accessible en bas de page

function loadWallet(){
  try{
    const raw = localStorage.getItem(LS_WALLET);
    const w = raw ? JSON.parse(raw) : {};
    return {
      earned: Math.max(0, parseInt(w.earned, 10) || 0),
      xpCredited: Math.max(0, parseInt(w.xpCredited, 10) || 0),
      spent: Math.max(0, parseInt(w.spent, 10) || 0),
      refunded: Math.max(0, parseInt(w.refunded, 10) || 0),
      rewarded: Math.max(0, parseInt(w.rewarded, 10) || 0)
    };
  }catch(e){ return { earned:0, xpCredited:0, spent:0, refunded:0, rewarded:0 }; }
}
function saveWallet(w){
  localStorage.setItem(LS_WALLET, JSON.stringify(w));
}

// convertit l'XP non encore crédité en Brossards ; renvoie le portefeuille à jour
function syncWallet(){
  const w = loadWallet();
  const xp = computeTotalXp();
  if(xp > w.xpCredited){
    const gained = Math.floor((xp - w.xpCredited) / BROSSARD_XP_RATE);
    if(gained > 0){
      w.earned += gained;
      w.xpCredited += gained * BROSSARD_XP_RATE;
      saveWallet(w);
    }
  } else if(xp < w.xpCredited){
    // statistiques réinitialisées : on garde les Brossards, on repart de l'XP actuelle
    w.xpCredited = xp - (xp % BROSSARD_XP_RATE);
    saveWallet(w);
  }
  return w;
}

function getBrossards(){
  const w = syncWallet();
  return Math.max(0, w.earned + w.refunded + w.rewarded - w.spent);
}

// dépense des Brossards (utilisé par le futur gatcha) ; renvoie false si solde insuffisant
function spendBrossards(amount){
  const w = syncWallet();
  if(amount <= 0 || w.earned + w.refunded + w.rewarded - w.spent < amount) return false;
  w.spent += amount;
  saveWallet(w);
  return true;
}

// crédite des Brossards (vente de doublons)
function creditBrossards(amount){
  if(amount <= 0) return;
  const w = syncWallet();
  w.refunded += amount;
  saveWallet(w);
}

function isPassUnlocked(){
  return getPlayerLevel() >= PASS_UNLOCK_LEVEL;
}
