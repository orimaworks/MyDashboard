function passRerender(scrollToId, block){
  const wrap = document.querySelector(".pass-map-wrap");
  const sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;   // zoom : on garde le cadrage
  renderPass();
  const wrap2 = document.querySelector(".pass-map-wrap");
  if(wrap2){ wrap2.scrollLeft = sl; wrap2.scrollTop = st; }
  if(scrollToId){
    const el = document.getElementById(scrollToId);
    if(el && el.scrollIntoView) el.scrollIntoView({ behavior:"smooth", block:block || "start" });
  }
}

function attachPassListeners(){
  const cat = passCatalog();
  const lg = document.getElementById("pass-result");
  if(lg) lg.addEventListener("toggle", ()=>{ passUi.logOpen = lg.open; });

  // bac à sable
  const q = (id)=>document.getElementById(id);
  if(q("pass-sb-start")) q("pass-sb-start").addEventListener("click", ()=>{
    passSandbox = { balance:2000, collection:emptyCollection() };
    passUi.result = null; passUi.forge = false; passUi.forgeSel = null;
    passRerender();
  });
  if(q("pass-sb-plus")) q("pass-sb-plus").addEventListener("click", ()=>{ passSandbox.balance += 1000; passRerender(); });
  if(q("pass-sb-reset")) q("pass-sb-reset").addEventListener("click", ()=>{
    passSandbox = { balance:2000, collection:emptyCollection() };
    passUi.result = null; passUi.forge = false; passUi.forgeSel = null;
    passRerender();
  });
  if(q("pass-sb-quit")) q("pass-sb-quit").addEventListener("click", ()=>{
    passSandbox = null;
    passUi.result = null; passUi.forge = false; passUi.forgeSel = null;
    passRerender();
  });

  // quantité + achats
  root.querySelectorAll(".pass-qty").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      passUi.qty = btn.dataset.qty === "max" ? "max" : parseInt(btn.dataset.qty, 10);
      passRerender();
    });
  });
  root.querySelectorAll(".pass-buy[data-pack]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!passIsOpen()) return;
      const r = passBuyPack(btn.dataset.pack, parseInt(btn.dataset.n, 10));
      if(!r.ok){ showSimpleToast("Pas assez de Brossards", "bad"); return; }
      playPackReveal(r, ()=>{ passUi.result = r; passUi.logOpen = true; passRerender("pass-result"); });
    });
  });

  // vente de doublons
  if(q("pass-sell")) q("pass-sell").addEventListener("click", ()=>{
    if(!passIsOpen()) return;
    const r = passSellDuplicates();
    if(!r.ok) return;
    passUi.result = r; passUi.logOpen = true;
    passRerender("pass-result");
  });

  // Faussaire
  if(q("pass-forge-btn")) q("pass-forge-btn").addEventListener("click", ()=>{
    if(!passIsOpen()) return;
    const coll = passStore().load();
    const firstTab = ["dept","chef","region"].find(t=>cat[t].some(it=>!coll.owned[it.id]));
    if(!firstTab) return;
    passUi.forge = true; passUi.forgeSel = null; passUi.tab = firstTab; passUi.onlyMissing = false;
    passRerender("pass-browser");
  });
  if(q("pass-forge-cancel")) q("pass-forge-cancel").addEventListener("click", ()=>{
    passUi.forge = false; passUi.forgeSel = null; passRerender();
  });
  if(q("pass-forge-ok")) q("pass-forge-ok").addEventListener("click", ()=>{
    if(!passIsOpen() || !passUi.forgeSel) return;
    const r = passForge(passUi.forgeSel);
    passUi.forge = false; passUi.forgeSel = null;
    if(!r.ok){ showSimpleToast("Forge impossible", "bad"); passRerender(); return; }
    playForgeReveal(r.item, ()=>{ passUi.result = r; passUi.logOpen = true; passRerender("pass-result"); });
  });
  root.querySelectorAll(".pass-tile.pickable").forEach(tile=>{
    tile.addEventListener("click", ()=>{ passUi.forgeSel = tile.dataset.id; passRerender("pass-browser"); });
  });

  // navigation dans la collection
  root.querySelectorAll("[data-pass-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      passUi.tab = btn.dataset.passTab;
      passUi.forgeSel = null;
      passUi.mapSel = null;
      passRerender();
    });
  });
  root.querySelectorAll("[data-pass-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ passUi.view = btn.dataset.passView; passRerender(); });
  });
  if(q("pass-zoom")) q("pass-zoom").addEventListener("click", ()=>{ passUi.mapZoom = !passUi.mapZoom; passRerender(); });
  root.querySelectorAll(".pm-shape").forEach(sh=>{
    sh.addEventListener("click", ()=>passMapTap(sh.dataset.id));
  });
  if(q("pass-filter")) q("pass-filter").addEventListener("click", ()=>{
    passUi.onlyMissing = !passUi.onlyMissing; passRerender();
  });
}

function renderStats(legacyKey){
  // accepte encore l'ancien format de clé (liens "voir les stats" depuis les récaps)
  if(legacyKey){
    const p = parseLegacyStatsKey(legacyKey);
    statsParent = p.parent;
    statsChild = p.child;
    if(p.child === "classic"){
      const last = loadSessions().filter(x=>(x.type||"classic")===statsTypeKey(p.parent, "classic")).slice(-1)[0];
      if(last) statsLen = classicLengthBucket(last);
    }
  }
  setActiveTab("stats");
  const sessions = loadSessions();

  const children = statsChildrenFor(statsParent);
  if(!children.some(c=>c.key===statsChild)) statsChild = "classic";
  const type = statsTypeKey(statsParent, statsChild);

  const parentsHtml = `
    <div class="stats-subtabs stats-level-parent">
      ${STATS_PARENTS.map(p=>`<button class="stats-subtab ${p.key==="chaos" ? "chaos-subtab " : ""}${statsParent===p.key?"active":""}" data-stats-parent="${p.key}">${p.label}</button>`).join("")}
    </div>`;
  const childrenHtml = `
    <div class="stats-subtabs stats-level-child">
      ${children.map(c=>`<button class="stats-subtab ${statsChild===c.key?"active":""}" data-stats-child="${c.key}">${c.label}</button>`).join("")}
    </div>`;
  const lengthsHtml = statsChild === "classic" ? `
    <div class="stats-subtabs stats-level-length">
      ${STATS_LENGTHS.map(n=>`<button class="stats-subtab ${statsLen===n?"active":""}" data-stats-len="${n}">${n} manches</button>`).join("")}
    </div>` : "";
  const navHtml = parentsHtml + childrenHtml + lengthsHtml;

  let contentHtml;
  if(statsChild === "classic") contentHtml = buildClassicStatsHtml(sessions, type, statsLen);
  else if(statsChild === "exam") contentHtml = buildExamStatsHtml(sessions, type);
  else contentHtml = buildInfiniStatsHtml(sessions, type);

  root.innerHTML = `
    <div class="card">
      <h1>Statistiques</h1>
      ${navHtml}
      ${contentHtml}
      <div class="btn-row" style="margin-top:26px;">
        <button class="ghost" id="btn-export">Exporter (JSON)</button>
        <button class="ghost" id="btn-export-csv">Exporter (CSV)</button>
        <button class="ghost danger" id="btn-reset-stats">Réinitialiser les statistiques</button>
      </div>
    </div>
  `;

  root.querySelectorAll("[data-stats-parent]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      statsParent = btn.dataset.statsParent;
      if(!statsChildrenFor(statsParent).some(c=>c.key===statsChild)) statsChild = "classic";
      renderStats();
    });
  });
  root.querySelectorAll("[data-stats-child]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ statsChild = btn.dataset.statsChild; renderStats(); });
  });
  root.querySelectorAll("[data-stats-len]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ statsLen = parseInt(btn.dataset.statsLen, 10); renderStats(); });
  });

  const moreBtn = document.getElementById("btn-podium-more");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{
    const t = moreBtn.dataset.type;
    const idx = STATS_PODIUM_STAGES.indexOf(statsPodiumLimit[t]);
    statsPodiumLimit[t] = STATS_PODIUM_STAGES[Math.min(idx+1, STATS_PODIUM_STAGES.length-1)];
    renderStats();
  });
  const lessBtn = document.getElementById("btn-podium-less");
  if(lessBtn) lessBtn.addEventListener("click", ()=>{
    const t = lessBtn.dataset.type;
    const idx = STATS_PODIUM_STAGES.indexOf(statsPodiumLimit[t]);
    statsPodiumLimit[t] = STATS_PODIUM_STAGES[Math.max(idx-1, 0)];
    renderStats();
  });

  document.getElementById("btn-export").addEventListener("click", exportSessions);
  document.getElementById("btn-export-csv").addEventListener("click", exportSessionsCsv);
  document.getElementById("btn-reset-stats").addEventListener("click", ()=>{
    if(confirm("Supprimer définitivement toutes les statistiques enregistrées ?")){
      saveSessions([]);
      applyTheme();
      renderStats();
    }
  });
}

function exportSessions(){
  const data = JSON.stringify(loadSessions(), null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;

/* =========================================================
   SAUVEGARDE (export/import base64)
   ========================================================= */
function buildSavePayload(){
  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    config: CONFIG,
    sessions: loadSessions(),
    achievements: ACHIEVEMENTS_UNLOCKED,
    wallet: loadWallet(),
    collection: loadCollection(),
    achievementsPaid: loadAchvPaid(),
    appVersion: GAME_VERSION,
    exclusivesV: 1          // sauvegarde postérieure aux exclusivités du Pass (le fond n'est plus acquis d'office)
  };
}

function encodeSaveBase64(){
  const json = JSON.stringify(buildSavePayload());
  // gère les accents/caractères Unicode, que btoa seul ne supporte pas
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeSaveBase64(b64){
  const json = decodeURIComponent(escape(atob(b64.trim())));
  return JSON.parse(json);
}

function applySavePayload(payload){
  if(!payload || typeof payload !== "object" || !payload.config || !Array.isArray(payload.sessions)){
    throw new Error("Format de sauvegarde invalide");
  }
  CONFIG = deepMergeConfig(DEFAULT_CONFIG, payload.config);
  saveConfig(CONFIG);
  saveSessions(payload.sessions);
  ACHIEVEMENTS_UNLOCKED = payload.achievements && typeof payload.achievements === "object" ? payload.achievements : {};
  saveAchievements(ACHIEVEMENTS_UNLOCKED);
  // portefeuille : restauré tel quel ; absent (ancienne sauvegarde) -> recalculé depuis l'XP importée
  if(payload.wallet && typeof payload.wallet === "object"){
    saveWallet({
      earned: Math.max(0, parseInt(payload.wallet.earned, 10) || 0),
      xpCredited: Math.max(0, parseInt(payload.wallet.xpCredited, 10) || 0),
      spent: Math.max(0, parseInt(payload.wallet.spent, 10) || 0),
      refunded: Math.max(0, parseInt(payload.wallet.refunded, 10) || 0),
      rewarded: Math.max(0, parseInt(payload.wallet.rewarded, 10) || 0)
    });
  } else {
    saveWallet({ earned:0, xpCredited:0, spent:0, refunded:0, rewarded:0 });
  }
  syncWallet();
  // collection du Pass : restaurée telle quelle ; absente (ancienne sauvegarde) -> vide
  saveCollection(normalizeCollection(payload.collection));
  saveAchvPaid(payload.achievementsPaid && typeof payload.achievementsPaid === "object" ? payload.achievementsPaid : {});
  payAchievementRewards();   // ancienne sauvegarde : récompenses des succès importés versées une fois
  checkCollectionAchievements();
  seedUnlocksSeen();   // verrous recalculés sans fenêtre de déblocage
  applyTheme();
  updatePassNav();
}

function csvEscape(val){
  const s = String(val ?? "");
  if(/[",;\n]/.test(s)){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportSessionsCsv(){
  const sessions = loadSessions();
  const header = ["datetime","mode","duree_totale_s","nb_manches","nb_reponse_juste","dept_echec","nb_point","temps_moyen_reponse_s"];
  const rows = sessions.map(s=>{
    const failedCodes = s.rounds.filter(r=>!r.correct).map(r=>r.code || r.deptCode || "");
    const avgResp = s.rounds.length
      ? (s.rounds.reduce((a,r)=>a+r.responseMs,0)/s.rounds.length/1000).toFixed(1)
      : "";
    return [
      s.date,
      modeLabel(s.type || "classic"),
      (s.durationMs/1000).toFixed(1),
      s.rounds.length,
      s.rounds.filter(r=>r.correct).length,
      failedCodes.join(";"),
      s.score,
      avgResp
    ].map(csvEscape).join(",");
  });
  const csv = [header.join(","), ...rows].join("\n");
  // BOM pour qu'Excel affiche correctement les accents
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "stats_depts.csv";
  a.click();
  URL.revokeObjectURL(url);
}

const LS_UNLOCKS = "deptgame_unlocks_v1";

// --- fenêtre générique : Échap ou clic à l'extérieur pour fermer (sauf dismissible:false) ---
const modalStack = [];
function openModal(html, opts){
  opts = opts || {};
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box ${opts.wide ? "modal-wide" : ""} ${opts.className || ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(overlay);
  const dismissible = opts.dismissible !== false;
  const modal = { overlay, box:overlay.firstElementChild };
  const onKey = (e)=>{
    if(e.key === "Escape" && dismissible && modalStack[modalStack.length - 1] === modal){
      e.stopPropagation();
      modal.close();
    }
  };
  modal.close = ()=>{
    if(!overlay.isConnected) return;
    overlay.remove();
    document.removeEventListener("keydown", onKey, true);
    const i = modalStack.indexOf(modal); if(i >= 0) modalStack.splice(i, 1);
    if(opts.onClose) opts.onClose();
  };
  document.addEventListener("keydown", onKey, true);
  overlay.addEventListener("mousedown", (e)=>{ if(e.target === overlay && dismissible) modal.close(); });
  modalStack.push(modal);
  return modal;
}

// --- déblocages : mémoire de ce qui a déjà été annoncé ---
function loadUnlocksSeen(){
  try{
    const raw = localStorage.getItem(LS_UNLOCKS);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveUnlocksSeen(o){ localStorage.setItem(LS_UNLOCKS, JSON.stringify(o)); }
// marque comme "déjà vu" tout ce qui est débloqué à cet instant, sans fenêtre
function seedUnlocksSeen(){
  const seen = { __v2:true };
  featureDefs().forEach(f=>{ if(f.unlocked()) seen[f.key] = true; });
  saveUnlocksSeen(seen);
}

let pendingUnlocks = [];
let unlockFlushTimer = null;
// à appeler après tout événement qui peut débloquer quelque chose (niveau, succès, import)
function checkUnlocks(){
  const seen = loadUnlocksSeen();
  if(seen === null){ seedUnlocksSeen(); updateNavLocks(); return; }
  const fresh = featureDefs().filter(f=>f.unlocked() && !seen[f.key]);
  updateNavLocks();
  if(!fresh.length) return;
  fresh.forEach(f=>{ seen[f.key] = true; });
  saveUnlocksSeen(seen);
  pendingUnlocks = pendingUnlocks.concat(fresh);
  if(!unlockFlushTimer){
    // petit délai : on regroupe ce qui se débloque en même temps (niveau + succès) en une seule fenêtre
    unlockFlushTimer = setTimeout(flushUnlocks, 700);
  }
}
function flushUnlocks(){
  unlockFlushTimer = null;
  const items = pendingUnlocks; pendingUnlocks = [];
  if(!items.length) return;
  if(Date.now() - lastConfettiAt > 2500) celebrateLevelUp();   // pas de double confetti après un passage de niveau
  const list = items.map(f=>`
    <div class="unlock-item">
      <span class="unlock-ic">${f.icon}</span>
      <span class="unlock-txt"><b>${f.name}</b><br><span class="muted">${f.blurb}</span>
        ${f.swatch ? `<span class="unlock-swatch">${f.swatch.map(c=>`<span style="background:${c}"></span>`).join("")}</span>` : ""}
      </span>
    </div>`).join("");
  const m = openModal(`
    <div class="unlock-popup">
      <h1 style="font-size:22px;">🔓 ${items.length > 1 ? "Nouveautés !" : "Débloqué !"}</h1>
      <div class="unlock-list">${list}</div>
      <div class="modal-actions" style="margin-top:18px;">
        <button class="primary" id="unlock-ok" style="flex:1;">Super !</button>
      </div>
    </div>`);
  m.box.querySelector("#unlock-ok").addEventListener("click", m.close);
  m.box.querySelector("#unlock-ok").focus({ preventScroll:true });
}

// section d'aide correspondant à l'écran affiché
function helpContextKey(){
  const type = (g)=>String((g && g.type) || "");
  if(typeof game !== "undefined" && game !== null) return type(game).startsWith("exam") ? "exam" : "dept";
  if(typeof cheflieuGame !== "undefined" && cheflieuGame !== null) return type(cheflieuGame).startsWith("exam") ? "exam" : "cheflieu";
  if(typeof chaosGame !== "undefined" && chaosGame !== null) return "chaos";
  switch(currentView){
    case "home":         return homeActiveTab === "cheflieu" ? "cheflieu" : homeActiveTab === "chaos" ? "chaos" : "dept";
    case "exam":         return "exam";
    case "pass":         return "pass";
    case "achievements": return "achievements";
    case "stats":        return "stats";
    case "cheatsheet":   return "cheatsheet";
    case "settings":     return "settings";
    default:             return "general";
  }
}

function openHelp(targetKey){
  targetKey = targetKey || helpContextKey();
  const secs = helpSections().map(sec=>{
    const locked = sec.lock && !isFeatureUnlocked(sec.lock);
    const body = locked
      ? `<div class="help-locked">${lockIconHtml(22)}<span>Verrouillé — ${featureDef(sec.lock).condition}</span></div>`
      : sec.html;
    return `<section class="help-sec ${locked ? "is-locked" : ""}" data-help="${sec.key}">
      <h2>${sec.title}${locked ? lockIconHtml() : ""}</h2>
      ${body}
    </section>`;
  }).join("");
  const m = openModal(`
    <div class="help-head">
      <h1 style="font-size:22px; margin:0;">Aide</h1>
      <button class="ghost help-close" id="help-close" aria-label="Fermer">✕</button>
    </div>
    <div class="help-body" id="help-body">${secs}</div>`, { wide:true });
  m.box.querySelector("#help-close").addEventListener("click", m.close);
  const body = m.box.querySelector("#help-body");
  const target = body.querySelector(`[data-help="${targetKey}"]`);
  if(target){
    body.scrollTop = target.offsetTop - body.offsetTop - 4;   // rubrique contextuelle en haut de la fenêtre
    target.classList.add("flash");
  }
}
document.getElementById("help-fab").addEventListener("click", ()=>openHelp());

function navigate(view, param){
  const lockKey = lockKeyForView(view);
  if(lockKey && !isFeatureUnlocked(lockKey)){ showLockPopup(lockKey); return; }
  if(view==="home") renderHome();
  else if(view==="training") renderTraining();
  else if(view==="cheatsheet") renderCheatsheet();
  else if(view==="exam") renderExamHome();
  else if(view==="achievements") renderAchievements();
  else if(view==="pass") renderPass();
  else if(view==="stats") renderStats(param);
  else if(view==="settings") renderSettings();
}

function isGameInProgress(){
  return game !== null || cheflieuGame !== null || chaosGame !== null;
}

function confirmLeaveIfPlaying(){
  if(!isGameInProgress()) return true;
  return confirm("Une partie est en cours. Voulez-vous vraiment quitter ? Votre progression sera perdue.");
}

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const lockKey = lockKeyForView(btn.dataset.view);
    if(lockKey && !isFeatureUnlocked(lockKey)){ showLockPopup(lockKey); return; }
    if(!confirmLeaveIfPlaying()) return;
    game = null;
    cheflieuGame = null;
    chaosGame = null;
    navigate(btn.dataset.view);
  });
});
document.getElementById("settings-gear").addEventListener("click", ()=>{
  if(!confirmLeaveIfPlaying()) return;
  game = null;
  cheflieuGame = null;
  chaosGame = null;
  navigate("settings");
});
window.addEventListener("beforeunload", (e)=>{
  if(isGameInProgress()){
    e.preventDefault();
    e.returnValue = "";
  }
});

// Raccourcis clavier : 1/2/3 pour choisir Duo/Carré/Cash, 1-4 pour choisir une réponse Duo/Carré.
// Désactivés si le focus est dans un champ texte, pour ne pas gêner la saisie (codes, recherche de ville).
document.addEventListener("keydown", (e)=>{
  if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if(document.querySelector(".modal-overlay, .rv-overlay")) return;   // fenêtre ouverte : pas de raccourcis de jeu
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(!["1","2","3","4"].includes(e.key)) return;

  const modeButtons = document.querySelectorAll(".mode-row .mode-btn[data-mode]");
  if(modeButtons.length){
    const idx = parseInt(e.key, 10) - 1;
    if(modeButtons[idx]){ e.preventDefault(); modeButtons[idx].click(); }
    return;
  }
  const choiceButtons = document.querySelectorAll(".choices .choice-btn");
  if(choiceButtons.length){
    const idx = parseInt(e.key, 10) - 1;
    if(choiceButtons[idx]){ e.preventDefault(); choiceButtons[idx].click(); }
  }
});


/* =========================================================
   EASTER EGG : code Konami  ↑ ↑ ↓ ↓ ← → ← → B A Entrée (Entrée = Start)
   → succès secret « Full power-up ! » + palette cachée 8-bit
   ========================================================= */
const KONAMI_SEQ = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a","Enter"];
let _konamiPos = 0;
function playKonamiSound(){          // WebAudio, ondes carrées, calé sur l'animation (arpège, 6 bips de jauge, fanfare finale)
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const beep = (at, f, dur, vol)=>{
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + at, end = t0 + dur;
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(end + 0.02);
    };
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i)=>beep(i * 0.07, f, 0.12, 0.08));        // flash d'ouverture
    [392, 440, 494, 523.25, 587.33, 659.25].forEach((f, i)=>beep(2.9 + i * 0.25, f, 0.1, 0.06));   // la jauge s'allume
    [523.25, 659.25, 783.99, 1046.5].forEach((f)=>beep(4.15, f, 0.7, 0.05));                // « full power-up »
    setTimeout(()=>{ ctx.close().catch(()=>{}); }, 5600);
  }catch(e){ /* ignore */ }
}
function runKonamiEasterEgg(){
  if(document.querySelector(".kn-overlay")) return;
  const first = !isAchievementUnlocked("secret_konami");
  unlockAchievement("secret_konami");                       // débloque aussi la palette 8-bit
  CONFIG.theme = "8bit"; saveConfig(CONFIG); applyTheme();
  if(document.querySelector(".theme-grid") && typeof renderSettings === "function") renderSettings();
  const line = (cls, n, d, txt)=>`<div class="kn-line ${cls}" style="--n:${n}; --d:${d}s">${txt}</div>`;
  const t3 = first ? "PALETTE 8-BIT DÉBLOQUÉE" : "PALETTE 8-BIT ACTIVÉE";
  const cells = ["SPEED","MISSILE","DOUBLE","LASER","OPTION","SHIELD"].map((l, i)=>`<div class="kn-cell" style="--i:${i}"><i></i><span>${l}</span></div>`).join("");
  const ov = document.createElement("div");
  ov.className = "kn-overlay";
  ov.innerHTML = `<div class="kn-stars"></div><div class="kn-stars s2"></div>
    <div class="kn-flash"></div><div class="kn-flash2"></div>
    <div class="kn-box">
      ${line("kn-l1", 11, 0.3, "KONAMI CODE")}
      <div class="kn-big">
        ${line("kn-lA", 4, 1.0, "FULL")}
        ${line("kn-lB", 10, 1.5, "POWER-UP !")}
      </div>
      <div class="kn-meter">${cells}</div>
      ${line("kn-l3", t3.length, 4.4, t3)}
      <div class="kn-line kn-l4" style="--n:1; --d:0s">▶ ENTRÉE POUR CONTINUER</div>
    </div>`;
  document.body.appendChild(ov);
  playKonamiSound();
  let closed = false;
  const close = ()=>{
    if(closed) return; closed = true;
    document.removeEventListener("keydown", onk, true);
    ov.classList.add("out"); setTimeout(()=>ov.remove(), 320);
  };
  const onk = (e)=>{ if(e.repeat) return; if(e.key === "Enter" || e.key === "Escape" || e.key === " "){ e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onk, true);
  ov.addEventListener("click", close);
  setTimeout(close, 10000);
}
document.addEventListener("keydown", (e)=>{
  if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const ae = document.activeElement, tag = ae && ae.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (ae && ae.isContentEditable)){ _konamiPos = 0; return; }   // saisie en cours : on ne surveille pas
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if(k === KONAMI_SEQ[_konamiPos]){
    _konamiPos++;
    if(_konamiPos === KONAMI_SEQ.length){
      _konamiPos = 0;
      e.preventDefault();                  // l'Entrée finale ne doit pas « cliquer » le bouton qui a le focus
      runKonamiEasterEgg();
    }
  }else{
    _konamiPos = (k === KONAMI_SEQ[0]) ? 1 : 0;
  }
});
